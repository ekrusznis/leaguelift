<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">Rally26 connected platform diagram</title>
  <desc id="diagramDesc">The Rally26 mark at the center, connected to Campaigns, Fees &amp; Payments, Team Stores, Store Orders, Communications, and Reports &amp; Insights.</desc>

  <defs>
    <pattern id="bgLines" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1" />
    </pattern>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2600C" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#F2600C" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#F2600C" stop-opacity="0" />
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Icon symbols, 48x48 viewBox, white stroke with a single orange accent -->
    <symbol id="icon-campaigns" viewBox="0 0 48 48">
      <path d="M12 18 L33 9 L33 35 L12 26 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
      <rect x="6" y="19" width="6" height="8" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M15 27 L17 37" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M37 12 L42 8" stroke="#FF7A33" stroke-width="2.5" stroke-linecap="round" />
      <path d="M39 20 L45 20" stroke="#FF7A33" stroke-width="2.5" stroke-linecap="round" />
      <path d="M37 28 L42 32" stroke="#FF7A33" stroke-width="2.5" stroke-linecap="round" />
    </symbol>

    <symbol id="icon-fees" viewBox="0 0 48 48">
      <rect x="6" y="13" width="36" height="23" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <line x1="12" y1="20" x2="24" y2="20" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="31" cy="25" r="7" fill="none" stroke="#FF7A33" stroke-width="2.5" />
      <line x1="12" y1="30" x2="20" y2="30" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    </symbol>

    <symbol id="icon-teamstores" viewBox="0 0 48 48">
      <path d="M17 8 C17 8 19.5 12 24 12 C28.5 12 31 8 31 8 L40 15 L35 22 L31 18.5 L31 41 L17 41 L17 18.5 L13 22 L8 15 Z"
            fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    </symbol>

    <symbol id="icon-reports" viewBox="0 0 48 48">
      <rect x="8" y="27" width="7" height="13" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <rect x="20" y="19" width="7" height="21" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <rect x="32" y="11" width="7" height="29" rx="1.5" fill="none" stroke="#FF7A33" stroke-width="2.5" />
      <circle cx="35.5" cy="7" r="2.6" fill="#FF7A33" />
    </symbol>

    <symbol id="icon-communications" viewBox="0 0 48 48">
      <path d="M7 11 h22 a5 5 0 0 1 5 5 v8 a5 5 0 0 1 -5 5 h-14 l-8 7 v-7 a5 5 0 0 1 -5 -5 v-8 a5 5 0 0 1 5 -5 Z"
            fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linejoin="round" />
      <path d="M22 24 h16 a4 4 0 0 1 4 4 v5 a4 4 0 0 1 -4 4 h-2 v5 l-6 -5 h-8 a4 4 0 0 1 -4 -4 v-2"
            fill="none" stroke="#FF7A33" stroke-width="2.2" stroke-linejoin="round" />
      <circle cx="14" cy="20" r="1.6" fill="#FFFFFF" />
      <circle cx="19.5" cy="20" r="1.6" fill="#FFFFFF" />
      <circle cx="25" cy="20" r="1.6" fill="#FFFFFF" />
    </symbol>

    <symbol id="icon-storeorders" viewBox="0 0 48 48">
      <path d="M15 16 v-3 a9 9 0 0 1 18 0 v3" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <path d="M10 16 h28 l-2.5 24 h-23 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
      <circle cx="35" cy="10" r="4.5" fill="#FF7A33" />
    </symbol>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1536" height="1024" fill="#061321" />
  <rect x="0" y="0" width="1536" height="1024" fill="url(#bgLines)" />

  <!-- Center glow -->
  <circle cx="760" cy="512" r="280" fill="url(#centerGlow)" />

  <!-- Connector lines (drawn under cards) -->
  <g stroke="#F2600C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1.5 10" opacity="0.85">
    <line x1="640" y1="402" x2="510" y2="320" />
    <line x1="760" y1="402" x2="760" y2="320" />
    <line x1="880" y1="402" x2="1010" y2="320" />
    <line x1="640" y1="622" x2="510" y2="704" />
    <line x1="760" y1="622" x2="760" y2="704" />
    <line x1="880" y1="622" x2="1010" y2="704" />
  </g>
  <g fill="#F2600C">
    <circle cx="510" cy="320" r="5.5" />
    <circle cx="760" cy="320" r="5.5" />
    <circle cx="1010" cy="320" r="5.5" />
    <circle cx="510" cy="704" r="5.5" />
    <circle cx="760" cy="704" r="5.5" />
    <circle cx="1010" cy="704" r="5.5" />
  </g>

  <!-- Card template positions: col x = 110 / 560 / 1010, width 400, row y = 90 / 704, height 230 -->

  <!-- Campaigns -->
  <g filter="url(#cardShadow)">
    <rect x="110" y="90" width="400" height="230" rx="24" fill="#102B46" stroke="#FFFFFF" stroke-opacity="0.1" />
  </g>
  <use href="#icon-campaigns" x="282" y="116" width="56" height="56" />
  <text x="310" y="222" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Campaigns</text>
  <text x="310" y="257" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#C9D2DD">
    <tspan x="310" dy="0">Run promotions</tspan>
    <tspan x="310" dy="26">and fundraisers</tspan>
  </text>

  <!-- Fees & Payments -->
  <g filter="url(#cardShadow)">
    <rect x="560" y="90" width="400" height="230" rx="24" fill="#102B46" stroke="#FFFFFF" stroke-opacity="0.1" />
  </g>
  <use href="#icon-fees" x="732" y="116" width="56" height="56" />
  <text x="760" y="222" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Fees &amp; Payments</text>
  <text x="760" y="257" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#C9D2DD">
    <tspan x="760" dy="0">Manage financials</tspan>
    <tspan x="760" dy="26">and registrations</tspan>
  </text>

  <!-- Team Stores -->
  <g filter="url(#cardShadow)">
    <rect x="1010" y="90" width="400" height="230" rx="24" fill="#102B46" stroke="#FFFFFF" stroke-opacity="0.1" />
  </g>
  <use href="#icon-teamstores" x="1182" y="116" width="56" height="56" />
  <text x="1210" y="222" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Team Stores</text>
  <text x="1210" y="257" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#C9D2DD">
    <tspan x="1210" dy="0">Sell team gear</tspan>
    <tspan x="1210" dy="26">and apparel</tspan>
  </text>

  <!-- Reports & Insights -->
  <g filter="url(#cardShadow)">
    <rect x="110" y="704" width="400" height="230" rx="24" fill="#102B46" stroke="#FFFFFF" stroke-opacity="0.1" />
  </g>
  <use href="#icon-reports" x="282" y="730" width="56" height="56" />
  <text x="310" y="836" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Reports &amp; Insights</text>
  <text x="310" y="871" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#C9D2DD">
    <tspan x="310" dy="0">Analyze data</tspan>
    <tspan x="310" dy="26">and performance</tspan>
  </text>

  <!-- Communications -->
  <g filter="url(#cardShadow)">
    <rect x="560" y="704" width="400" height="230" rx="24" fill="#102B46" stroke="#FFFFFF" stroke-opacity="0.1" />
  </g>
  <use href="#icon-communications" x="732" y="730" width="56" height="56" />
  <text x="760" y="836" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Communications</text>
  <text x="760" y="871" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#C9D2DD">
    <tspan x="760" dy="0">Engage with</tspan>
    <tspan x="760" dy="26">your members</tspan>
  </text>

  <!-- Store Orders -->
  <g filter="url(#cardShadow)">
    <rect x="1010" y="704" width="400" height="230" rx="24" fill="#102B46" stroke="#FFFFFF" stroke-opacity="0.1" />
  </g>
  <use href="#icon-storeorders" x="1182" y="730" width="56" height="56" />
  <text x="1210" y="836" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Store Orders</text>
  <text x="1210" y="871" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#C9D2DD">
    <tspan x="1210" dy="0">Track and manage</tspan>
    <tspan x="1210" dy="26">orders</tspan>
  </text>

  <!-- Center Rally26 mark -->
  <g filter="url(#cardShadow)">
    <rect x="640" y="402" width="240" height="220" rx="28" fill="#102B46" stroke="#F2600C" stroke-opacity="0.45" stroke-width="1.5" />
  </g>
  <g transform="translate(700, 442) scale(0.72)">
    <path d="M100 40 L150 40 L185 90 L150 140 L100 140 L128 90 Z" fill="#F2600C" />
    <text x="8" y="148" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="168" letter-spacing="-4" fill="#FFFFFF">R</text>
  </g>
</svg>

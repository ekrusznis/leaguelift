<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="220" height="170" viewBox="0 0 220 170"
     role="img" aria-labelledby="title desc">
  <title id="title">LeagueLift logo mark light</title>
  <desc id="desc">LeagueLift overlapping double-L logo mark with transparent background.</desc>

  <!-- Transparent background by design -->

  <!-- Lower L -->
  <path d="M31 146 L66 34 L105 27 L80 112 L139 112 L127 146 Z"
        fill="#FFFFFF"/>

  <!-- Upper L -->
  <path d="M69 29 L116 20 L93 84 L123 84 L112 113 L69 113 L88 53 L61 59 Z"
        fill="#20B26B"/>

  <!-- Forward/upward arrow integrated into the second L -->
  <path d="M111 81 L151 81 L151 62 L191 96 L151 130 L151 108 L111 108 Z"
        fill="#20B26B"/>

  <!-- Overlap notch -->
  <path d="M80 112 L96 112 L90 132 L74 132 Z"
        fill="#FFFFFF" opacity="0.96"/>
</svg>

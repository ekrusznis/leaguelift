name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17" # was 21 — see docs/adr/ADR-013-java-17-baseline.md

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew --no-daemon compileKotlin compileTestKotlin

      - name: Unit + integration tests
        run: ./gradlew --no-daemon test
        # Repository/integration tests use Testcontainers; the ubuntu-latest runner
        # ships Docker, so Testcontainers-backed PostgreSQL works here even though it
        # could not be exercised in the sandbox this scaffold was authored in.

      - name: Static analysis (dependency vulnerabilities)
        run: ./gradlew --no-daemon dependencyCheckAnalyze || true
        # Soft-fails until a dependency-check plugin is added to build.gradle.kts;
        # tracked as follow-up, not blocking Phase 0.

      - name: Build container image
        run: docker build -t leaguelift-backend:ci .

name: infra-bootstrap

# One-time (idempotent, safe to re-run) DigitalOcean resource provisioning: container
# registry + DNS zone/records for leaguelift.io pointed at the existing prod droplet.
# Run by hand from the Actions tab — this is infrastructure setup, not something that
# should fire on every push. See docs/adr/ADR-008.
#
# Runs on a GitHub-hosted runner deliberately, not locally: DigitalOcean's API isn't
# reachable from the sandbox this repo's early scaffolding was done in (network
# allowlist), but GitHub-hosted runners have unrestricted internet.

on:
  workflow_dispatch:
    inputs:
      droplet_ip:
        description: "Prod droplet public IPv4"
        required: true
        default: "45.55.68.239"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_SECRET }}

      - name: Create container registry (no-op if it already exists)
        run: |
          if doctl registry get >/dev/null 2>&1; then
            echo "Registry already exists, skipping."
          else
            doctl registry create leaguelift --subscription-tier basic --region nyc3
          fi

      - name: Create leaguelift.io DNS zone (no-op if it already exists)
        run: |
          if doctl compute domain get leaguelift.io >/dev/null 2>&1; then
            echo "Domain already exists in DO DNS, skipping create."
          else
            doctl compute domain create leaguelift.io --ip-address "${{ inputs.droplet_ip }}"
          fi

      - name: Upsert A records (apex, www, api)
        run: |
          set -e
          IP="${{ inputs.droplet_ip }}"

          upsert_a_record() {
            local name="$1"
            local existing_id
            existing_id=$(doctl compute domain records list leaguelift.io \
              --format ID,Type,Name --no-header | awk -v n="$name" '$2=="A" && $3==n {print $1}')
            if [ -n "$existing_id" ]; then
              echo "Updating existing A record for '$name' -> $IP"
              doctl compute domain records update leaguelift.io --record-id "$existing_id" --record-data "$IP"
            else
              echo "Creating A record for '$name' -> $IP"
              doctl compute domain records create leaguelift.io --record-type A --record-name "$name" --record-data "$IP" --record-ttl 3600
            fi
          }

          upsert_a_record "@"
          upsert_a_record "www"
          upsert_a_record "api"

      - name: Ensure a DO Cloud Firewall restricts the droplet to 22/80/443
        run: |
          set -e
          DROPLET_ID=$(doctl compute droplet list --format ID,PublicIPv4 --no-header \
            | awk -v ip="${{ inputs.droplet_ip }}" '$2==ip {print $1}')
          if [ -z "$DROPLET_ID" ]; then
            echo "Could not find a droplet with IP ${{ inputs.droplet_ip }} on this account/team — skipping firewall step." >&2
            exit 0
          fi
          if doctl compute firewall list --format Name --no-header | grep -qx "leaguelift-prod"; then
            echo "Firewall 'leaguelift-prod' already exists, skipping create."
          else
            doctl compute firewall create \
              --name leaguelift-prod \
              --droplet-ids "$DROPLET_ID" \
              --inbound-rules "protocol:tcp,ports:22,address:0.0.0.0/0,address:::/0 protocol:tcp,ports:80,address:0.0.0.0/0,address:::/0 protocol:tcp,ports:443,address:0.0.0.0/0,address:::/0" \
              --outbound-rules "protocol:tcp,ports:all,address:0.0.0.0/0,address:::/0 protocol:udp,ports:all,address:0.0.0.0/0,address:::/0"
          fi

      - name: Summary
        run: |
          echo "Registry: registry.digitalocean.com/leaguelift"
          echo "DNS: leaguelift.io, www.leaguelift.io, api.leaguelift.io -> ${{ inputs.droplet_ip }}"
          echo "DNS propagation can take up to a few hours. Caddy (on the droplet) will not"
          echo "successfully issue TLS certificates until these records resolve publicly —"
          echo "check with: dig +short leaguelift.io / dig +short api.leaguelift.io"

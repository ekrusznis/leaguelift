name: deploy

# Manual-approval deploy pipeline (DESIGN-DOC.md section 25.2). This is a Phase 0
# placeholder: it defines the intended stages but the actual DigitalOcean deployment
# steps are filled in with ADR-008 (DigitalOcean deployment), once accepted, and once
# staging infrastructure exists (see infra/digitalocean/README.md).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t leaguelift-backend:${{ github.sha }} backend
      - name: Build frontend image
        run: docker build -t leaguelift-frontend:${{ github.sha }} frontend
      # Push to registry step intentionally omitted until infra/digitalocean is wired up.

  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    environment: ${{ inputs.environment }}
    steps:
      - name: Placeholder
        run: |
          echo "Deployment target: ${{ inputs.environment }}"
          echo "Wire up DigitalOcean App Platform deploy steps here once ADR-008 is accepted."
          echo "Production deploys require the 'production' GitHub Environment's manual approval gate."

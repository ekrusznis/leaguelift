spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/leaguelift}
    username: ${POSTGRES_USER:leaguelift}
    password: ${POSTGRES_PASSWORD:leaguelift_local_password}
  flyway:
    # db/seed holds dev-only fixture data (four test users, one per dashboard role —
    # see docs/LEAGUELIFT_DASHBOARD_DESIGN.md) and must never apply to staging/prod,
    # so it's only added to the locations list here, not in the base application.yml.
    locations: classpath:db/migration,classpath:db/seed
    # Required because db/seed's V9000+ fixture migrations sit "ahead of" the real
    # sequence — see the comment on FlywayConfig.outOfOrder for why this is safe.
    out-of-order: true

# There is no auth bypass in any profile, including local — authenticate for real via
# POST /api/v1/auth/register or /login (see docs/security.md), or use one of the
# seeded dashboard-role accounts (db/seed/V9000__dev_seed_dashboard_role_users.sql,
# password "DevPassword123!" for all four).
leaguelift:
  # Dev-only fixed secret — never used outside the local profile. Must be at least
  # 32 bytes for HS256 (see JwtProperties.secretKey).
  jwt:
    secret: "local-dev-only-jwt-signing-secret-do-not-use-in-prod!!"
  # S3-compatible object storage — MinIO via compose locally (ADR-012). Defaults match
  # compose.yaml's minio/minio-init services.
  spaces:
    endpoint: ${SPACES_ENDPOINT:http://localhost:9000}
    access-key: ${SPACES_ACCESS_KEY:leaguelift}
    secret-key: ${SPACES_SECRET_KEY:leaguelift_local_password}
    bucket: ${SPACES_BUCKET:leaguelift-local}
    region: ${SPACES_REGION:us-east-1}
  # Stripe Connect Express onboarding only (ADR-005) — no live charge routing. Blank by
  # default since no real Stripe account exists yet; onboarding calls fail with a clear
  # error until STRIPE_SECRET_KEY (a test-mode secret key) is supplied in .env.
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Printify catalog/orders (Phase 4 slice 1) — catalog reads only need apiToken;
  # creating a draft order also needs shopId (a "Manual/API" Printify shop). Blank by
  # default; calls fail with a clear error until real Printify credentials are supplied.
  printify:
    api-token: ${PRINTIFY_API_TOKEN:}
    shop-id: ${PRINTIFY_SHOP_ID:}
  # Phase 5 slice 1 (ADR-017) — starting pilot values, not final pricing. Both configurable without a redeploy.
  platform:
    fee-basis-points: ${PLATFORM_FEE_BASIS_POINTS:500}
  payout:
    holding-period-days: ${PAYOUT_HOLDING_PERIOD_DAYS:7}
  # Phase 6 remainder (ADR-019) — a minimal @Scheduled reminder, not the real Phase 8
  # notification infrastructure. Configurable without a redeploy.
  sponsorship:
    renewal-reminder:
      enabled: ${SPONSORSHIP_RENEWAL_REMINDER_ENABLED:true}
      days-before: ${SPONSORSHIP_RENEWAL_REMINDER_DAYS_BEFORE:14}
      cron: ${SPONSORSHIP_RENEWAL_REMINDER_CRON:0 0 8 * * *}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.leaguelift: DEBUG

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/rally26}
    username: ${POSTGRES_USER:rally26}
    password: ${POSTGRES_PASSWORD:rally26_local_password}
  flyway:
    # db/seed holds dev-only fixture data (four test users, one per dashboard role —
    # see docs/RALLY26_DASHBOARD_DESIGN.md) and must never apply to staging/prod,
    # so it's only added to the locations list here, not in the base application.yml.
    locations: classpath:db/migration,classpath:db/seed
    # Required because db/seed's V9000+ fixture migrations sit "ahead of" the real
    # sequence — see the comment on FlywayConfig.outOfOrder for why this is safe.
    out-of-order: true

# There is no auth bypass in any profile, including local — authenticate for real via
# POST /api/v1/auth/register or /login (see docs/security.md), or use one of the
# seeded dashboard-role accounts (db/seed/V9000__dev_seed_dashboard_role_users.sql,
# password "DevPassword123!" for all four).
rally26:
  # Dev-only fixed secret — never used outside the local profile. Must be at least
  # 32 bytes for HS256 (see JwtProperties.secretKey).
  jwt:
    secret: "local-dev-only-jwt-signing-secret-do-not-use-in-prod!!"
  # S3-compatible object storage — MinIO via compose locally (ADR-012). Defaults match
  # compose.yaml's minio/minio-init services.
  spaces:
    endpoint: ${SPACES_ENDPOINT:http://localhost:9000}
    # Browser-facing endpoint baked into presigned upload/download URLs — see LR-029.
    # In compose.yaml, `endpoint` is the container-internal `http://minio:9000` (only
    # resolvable inside the Docker network), but the browser runs on the host, so
    # presigned URLs must use MinIO's host-mapped port instead.
    public-endpoint: ${SPACES_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${SPACES_ACCESS_KEY:rally26}
    secret-key: ${SPACES_SECRET_KEY:rally26_local_password}
    bucket: ${SPACES_BUCKET:rally26-local}
    region: ${SPACES_REGION:us-east-1}
  # Shared Stripe credentials for existing test-mode commerce/Connect flows and the
  # organization subscription Checkout added by Phase 24.6/26.1. Blank locally unless
  # STRIPE_SECRET_KEY/STRIPE_WEBHOOK_SECRET are supplied; use Stripe test keys for local QA.
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    tax:
      order-enabled: ${STRIPE_TAX_ORDER_ENABLED:false}
      order-tax-code: ${STRIPE_TAX_ORDER_TAX_CODE:txcd_99999999}
      contribution-enabled: ${STRIPE_TAX_CONTRIBUTION_ENABLED:false}
      contribution-tax-code: ${STRIPE_TAX_CONTRIBUTION_TAX_CODE:}
      sponsorship-enabled: ${STRIPE_TAX_SPONSORSHIP_ENABLED:false}
      sponsorship-tax-code: ${STRIPE_TAX_SPONSORSHIP_TAX_CODE:}
      fee-payment-enabled: ${STRIPE_TAX_FEE_PAYMENT_ENABLED:false}
      fee-payment-tax-code: ${STRIPE_TAX_FEE_PAYMENT_TAX_CODE:}
  # Printify catalog/orders (Phase 4 slice 1) — catalog reads only need apiToken;
  # creating a draft order also needs shopId (a "Manual/API" Printify shop). Blank by
  # default; calls fail with a clear error until real Printify credentials are supplied.
  printify:
    api-token: ${PRINTIFY_API_TOKEN:}
    shop-id: ${PRINTIFY_SHOP_ID:}
    webhook-secret: ${PRINTIFY_WEBHOOK_SECRET:}
    webhook-enabled: ${PRINTIFY_WEBHOOK_ENABLED:false}
  # Phase 32 scaffold — Venmo (PayPal Business Checkout), Cash App Pay (Square),
  # and Affirm pay-over-time. Blank by default everywhere; PaymentMethodAvailabilityService
  # shows each as "Coming soon" until real, reviewed credentials are supplied — no
  # code change needed to activate, per DESIGN-DOC.md section 19.3 item 42.
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
  square:
    access-token: ${SQUARE_ACCESS_TOKEN:}
    location-id: ${SQUARE_LOCATION_ID:}
  affirm:
    public-api-key: ${AFFIRM_PUBLIC_API_KEY:}
    private-api-key: ${AFFIRM_PRIVATE_API_KEY:}
  # Phase 5 slice 1 (ADR-017) — starting pilot values, not final pricing. Both configurable without a redeploy.
  platform:
    fee-basis-points: ${PLATFORM_FEE_BASIS_POINTS:500}
  payout:
    holding-period-days: ${PAYOUT_HOLDING_PERIOD_DAYS:7}
  # Phase 6 remainder (ADR-019) — the scan half of the renewal reminder (see
  # SponsorshipRenewalScanner, rebuilt on the outbox worker as of Phase 8 slice 1,
  # ADR-022). Configurable without a redeploy.
  sponsorship:
    renewal-reminder:
      enabled: ${SPONSORSHIP_RENEWAL_REMINDER_ENABLED:true}
      days-before: ${SPONSORSHIP_RENEWAL_REMINDER_DAYS_BEFORE:14}
      cron: ${SPONSORSHIP_RENEWAL_REMINDER_CRON:0 0 8 * * *}
  # Phase 8 slice 1 (ADR-022) — the outbox consumer itself. Safe defaults, all
  # configurable without a redeploy.
  outbox:
    worker:
      enabled: ${OUTBOX_WORKER_ENABLED:true}
      poll-interval-ms: ${OUTBOX_WORKER_POLL_INTERVAL_MS:5000}
      batch-size: ${OUTBOX_WORKER_BATCH_SIZE:20}
      max-attempts: ${OUTBOX_WORKER_MAX_ATTEMPTS:5}
      backoff-base-seconds: ${OUTBOX_WORKER_BACKOFF_BASE_SECONDS:30}
      backoff-cap-seconds: ${OUTBOX_WORKER_BACKOFF_CAP_SECONDS:3600}
  # Phase 8 slice 1 (ADR-022) — "logging" (default) until a real Resend account is
  # configured; flip to "resend" once RESEND_API_KEY/RESEND_FROM_ADDRESS below are real.
  email:
    provider: ${EMAIL_PROVIDER:logging}
    resend:
      api-key: ${RESEND_API_KEY:}
      from-address: ${RESEND_FROM_ADDRESS:}
      webhook-secret: ${RESEND_WEBHOOK_SECRET:}
      # Phase 8 slice 4 — published Resend Template IDs. Blank until each is created
      # and published in the Resend dashboard; a handler with a blank ID here just
      # falls back to its original plain-text send (see ResendTemplateProperties).
      templates:
        verify-email-id: ${RESEND_TEMPLATE_VERIFY_EMAIL_ID:}
        password-reset-id: ${RESEND_TEMPLATE_PASSWORD_RESET_ID:}
        invitation-id: ${RESEND_TEMPLATE_INVITATION_ID:}
        welcome-id: ${RESEND_TEMPLATE_WELCOME_ID:}
        support-case-update-id: ${RESEND_TEMPLATE_SUPPORT_CASE_UPDATE_ID:}
        receipt-id: ${RESEND_TEMPLATE_RECEIPT_ID:}
        notification-id: ${RESEND_TEMPLATE_NOTIFICATION_ID:}
    # ADR-059 — Google Workspace SMTP, used only for support-case correspondence
    # (SupportCaseCreatedEmailHandler), never as the ambient EmailProvider above. Blank
    # username until a real Google Workspace app password is supplied; SmtpEmailProvider
    # logs and no-ops instead of attempting a real send until then.
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      from-address: ${SMTP_FROM_ADDRESS:support@rally26.com}
  # Used to build a complete, clickable URL in outbound emails (e.g. the invitation
  # accept link) — see FrontendProperties. Defaults to the local Vite dev server.
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  # Phase 8 slice 2 (ADR-023) — fee-due payment reminders, same shape as the
  # sponsorship renewal reminder. Configurable without a redeploy.
  fee:
    payment-reminder:
      enabled: ${FEE_PAYMENT_REMINDER_ENABLED:true}
      days-before: ${FEE_PAYMENT_REMINDER_DAYS_BEFORE:3}
      cron: ${FEE_PAYMENT_REMINDER_CRON:0 0 8 * * *}
  # Phase 8 slice 3 (ADR-024) — "logging" (default) until a real Twilio account is
  # configured; flip to "twilio" once the credentials below are real.
  sms:
    provider: ${SMS_PROVIDER:logging}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  # Phase 37 — mobile Google/Apple sign-in. Blank client-id defaults until Rally26
  # registers a real Google Cloud OAuth client and enables Sign in with Apple in its
  # Apple Developer account; OAuthSignInService fails closed (503) until then.
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    apple:
      client-id: ${APPLE_OAUTH_CLIENT_ID:}
  # Phase 12 slice 3 (ADR-033) — how often every ACTIVE ICS_FEED connection is
  # re-fetched and synced. Configurable without a redeploy.
  ics-feed:
    sync:
      enabled: ${ICS_FEED_SYNC_ENABLED:true}
      cron: ${ICS_FEED_SYNC_CRON:0 */30 * * * *}

  # Phase 19 connection/OAuth foundation (ADR-054). Disabled by default. Stubs
  # are local/test-only and RuntimeGuard rejects them in staging/prod.
  integrations:
    encryption-key: ${INTEGRATION_ENCRYPTION_KEY:}
    encryption-key-version: ${INTEGRATION_ENCRYPTION_KEY_VERSION:1}
    oauth-state-ttl-minutes: ${INTEGRATION_OAUTH_STATE_TTL_MINUTES:10}
    oauth-callback-base-url: ${INTEGRATION_OAUTH_CALLBACK_BASE_URL:http://localhost:8080/api/v1/integrations/oauth}
    stub-mode: ${INTEGRATION_STUB_MODE:false}
    providers:
      google-calendar:
        enabled: ${GOOGLE_CALENDAR_INTEGRATION_ENABLED:false}
        client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
        client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
        authorization-uri: ${GOOGLE_CALENDAR_AUTHORIZATION_URI:}
        token-uri: ${GOOGLE_CALENDAR_TOKEN_URI:}
        revocation-uri: ${GOOGLE_CALENDAR_REVOCATION_URI:}
      quickbooks-online:
        enabled: ${QUICKBOOKS_INTEGRATION_ENABLED:false}
        client-id: ${QUICKBOOKS_CLIENT_ID:}
        client-secret: ${QUICKBOOKS_CLIENT_SECRET:}
        authorization-uri: ${QUICKBOOKS_AUTHORIZATION_URI:}
        token-uri: ${QUICKBOOKS_TOKEN_URI:}
        revocation-uri: ${QUICKBOOKS_REVOCATION_URI:}
      sportsengine:
        enabled: ${SPORTSENGINE_INTEGRATION_ENABLED:false}
        client-id: ${SPORTSENGINE_CLIENT_ID:}
        client-secret: ${SPORTSENGINE_CLIENT_SECRET:}
        authorization-uri: ${SPORTSENGINE_AUTHORIZATION_URI:}
        token-uri: ${SPORTSENGINE_TOKEN_URI:}
        revocation-uri: ${SPORTSENGINE_REVOCATION_URI:}
      teamsnap:
        enabled: ${TEAMSNAP_INTEGRATION_ENABLED:false}
        client-id: ${TEAMSNAP_CLIENT_ID:}
        client-secret: ${TEAMSNAP_CLIENT_SECRET:}
        authorization-uri: ${TEAMSNAP_AUTHORIZATION_URI:}
        token-uri: ${TEAMSNAP_TOKEN_URI:}
        revocation-uri: ${TEAMSNAP_REVOCATION_URI:}
      instagram:
        enabled: ${INSTAGRAM_INTEGRATION_ENABLED:false}
        client-id: ${INSTAGRAM_CLIENT_ID:}
        client-secret: ${INSTAGRAM_CLIENT_SECRET:}
        authorization-uri: ${INSTAGRAM_AUTHORIZATION_URI:}
        token-uri: ${INSTAGRAM_TOKEN_URI:}
        revocation-uri: ${INSTAGRAM_REVOCATION_URI:}
      facebook:
        enabled: ${FACEBOOK_INTEGRATION_ENABLED:false}
        client-id: ${FACEBOOK_CLIENT_ID:}
        client-secret: ${FACEBOOK_CLIENT_SECRET:}
        authorization-uri: ${FACEBOOK_AUTHORIZATION_URI:}
        token-uri: ${FACEBOOK_TOKEN_URI:}
        revocation-uri: ${FACEBOOK_REVOCATION_URI:}
      x:
        enabled: ${X_INTEGRATION_ENABLED:false}
        client-id: ${X_CLIENT_ID:}
        client-secret: ${X_CLIENT_SECRET:}
        authorization-uri: ${X_AUTHORIZATION_URI:}
        token-uri: ${X_TOKEN_URI:}
        revocation-uri: ${X_REVOCATION_URI:}

  # Phase 17 support-case routing. The mailbox is public configuration; real delivery activation is Phase 20.
  support:
    inbox-email: ${RALLY26_SUPPORT_INBOX_EMAIL:support@rally26.com}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.rally26: DEBUG


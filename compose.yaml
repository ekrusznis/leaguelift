services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leaguelift}
      POSTGRES_USER: ${POSTGRES_USER:-leaguelift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaguelift_local_password}
    ports:
      - "5433:5432"
    volumes:
      - leaguelift-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leaguelift}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-leaguelift}
      POSTGRES_USER: ${POSTGRES_USER:-leaguelift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaguelift_local_password}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
      VITE_AUTH_DEV_MODE: ${VITE_AUTH_DEV_MODE:-true}
    ports:
      - "5173:80"

volumes:
  leaguelift-postgres-data:

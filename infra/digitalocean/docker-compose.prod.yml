# Production compose file for the single rally26 droplet (ADR-008). Lives at
# /opt/rally26/docker-compose.prod.yml on the droplet itself — deployed there by
# .github/workflows/deploy.yml, not committed with real secrets. Postgres is
# self-hosted here (not DO Managed Postgres) per the founder's cost/ops call; see
# ADR-008 for the backup/PITR mitigation this requires.
#
# backend/frontend images are PULLED from DigitalOcean Container Registry, never built
# on the droplet itself — CI builds and pushes them, this file only runs them.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rally26}
      POSTGRES_USER: ${POSTGRES_USER:-rally26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - rally26-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rally26}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port published — only reachable from other containers on this compose
    # network. Nothing outside this droplet can reach Postgres directly.

  backend:
    image: ${REGISTRY}/rally26-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rally26}
      POSTGRES_USER: ${POSTGRES_USER:-rally26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:?SPACES_ENDPOINT must be set in .env}
      SPACES_ACCESS_KEY: ${SPACES_ACCESS_KEY:?SPACES_ACCESS_KEY must be set in .env}
      SPACES_SECRET_KEY: ${SPACES_SECRET_KEY:?SPACES_SECRET_KEY must be set in .env}
      SPACES_BUCKET: ${SPACES_BUCKET:?SPACES_BUCKET must be set in .env}
      SPACES_REGION: ${SPACES_REGION:?SPACES_REGION must be set in .env}
      # Test-mode keys are fine to start — see application-prod.yml, both fail closed
      # (clear error, not a crash-loop) on any real charge/order attempt without them,
      # but the process itself still won't boot with these totally unset.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY must be set in .env (test-mode key is fine)}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set in .env}
      PRINTIFY_API_TOKEN: ${PRINTIFY_API_TOKEN:?PRINTIFY_API_TOKEN must be set in .env}
      PRINTIFY_SHOP_ID: ${PRINTIFY_SHOP_ID:?PRINTIFY_SHOP_ID must be set in .env}
      # Phase 32 scaffold — optional. Blank until the founder supplies real, reviewed
      # credentials; PaymentMethodAvailabilityService shows "Coming soon" until then.
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      AFFIRM_PUBLIC_API_KEY: ${AFFIRM_PUBLIC_API_KEY:-}
      AFFIRM_PRIVATE_API_KEY: ${AFFIRM_PRIVATE_API_KEY:-}
      FRONTEND_BASE_URL: https://rally26.com
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-logging}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      RESEND_TEMPLATE_VERIFY_EMAIL_ID: ${RESEND_TEMPLATE_VERIFY_EMAIL_ID:-}
      RESEND_TEMPLATE_PASSWORD_RESET_ID: ${RESEND_TEMPLATE_PASSWORD_RESET_ID:-}
      RESEND_TEMPLATE_INVITATION_ID: ${RESEND_TEMPLATE_INVITATION_ID:-}
      RESEND_TEMPLATE_WELCOME_ID: ${RESEND_TEMPLATE_WELCOME_ID:-}
      RESEND_TEMPLATE_SUPPORT_CASE_UPDATE_ID: ${RESEND_TEMPLATE_SUPPORT_CASE_UPDATE_ID:-}
      RESEND_TEMPLATE_RECEIPT_ID: ${RESEND_TEMPLATE_RECEIPT_ID:-}
      RESEND_TEMPLATE_NOTIFICATION_ID: ${RESEND_TEMPLATE_NOTIFICATION_ID:-}
      # ADR-059 — Google Workspace SMTP, support-case correspondence only (never the
      # ambient EmailProvider above). Blank SMTP_USERNAME/PASSWORD means SmtpEmailProvider
      # logs and no-ops instead of a real send.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-support@rally26.com}
      SMS_PROVIDER: ${SMS_PROVIDER:-logging}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # New Relic APM (Workstream C, 2026-08-12) — a blank license key means the agent
      # starts but reports nothing; it never blocks the app from booting (Dockerfile).
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: rally26-backend
      JAVA_TOOL_OPTIONS: -javaagent:/app/newrelic/newrelic.jar
      # Social Sharing & Connected Accounts, Slice 1. X's own OAuth2 endpoints are
      # fixed, public, non-secret constants (researched, not guessed — see
      # XAuthorizationAdapter's doc comment), so they're hardcoded here the same way
      # FRONTEND_BASE_URL above is, rather than round-tripped through .env. Only the
      # app's own client id/secret are real secrets. Instagram/Facebook stay blank
      # (INTEGRATION_ENABLED unset) until a new Meta developer app exists.
      X_INTEGRATION_ENABLED: "true"
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      X_AUTHORIZATION_URI: https://x.com/i/oauth2/authorize
      X_TOKEN_URI: https://api.x.com/2/oauth2/token
      X_REVOCATION_URI: https://api.x.com/2/oauth2/revoke
    # Bound to loopback only — reachable from the droplet itself (the GitHub Actions
    # deploy health check curls http://localhost:8080 over SSH on the host) without
    # exposing the backend directly to the internet. Public traffic still only reaches
    # it through Caddy -> the `backend` service name on the compose network.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    image: ${REGISTRY}/rally26-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # Nightly pg_dump -> DO Spaces. Self-hosted Postgres has no managed backup/PITR, so
  # this is the mitigation ADR-008 calls out as a hard requirement, not a nice-to-have.
  # A quarterly real restore-rehearsal (DESIGN-DOC.md section 18.3) is still a launch
  # gate on top of this existing — this only proves backups are *taken*, not restorable.
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-rally26}
      POSTGRES_USER: ${POSTGRES_USER:-rally26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:?SPACES_ENDPOINT must be set in .env}
      SPACES_ACCESS_KEY: ${SPACES_ACCESS_KEY:?SPACES_ACCESS_KEY must be set in .env}
      SPACES_SECRET_KEY: ${SPACES_SECRET_KEY:?SPACES_SECRET_KEY must be set in .env}
      SPACES_BUCKET: ${SPACES_BUCKET:?SPACES_BUCKET must be set in .env}
      SPACES_REGION: ${SPACES_REGION:?SPACES_REGION must be set in .env}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}

volumes:
  rally26-postgres-data:
  caddy_data:
  caddy_config:

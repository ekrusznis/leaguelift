tests:
  - displayName: "[SMOKE] Subscription state - Active subscription"
    id: subscription-active
    steps:
      - goal: >-
          Complete the first-launch walkthrough if needed and sign in with the supplied
          owner account pre-provisioned specifically in the active subscription state.
        hint: Do not change the account's subscription state during this test.
        finalScreenAssertion: >-
          The owner reaches the native Owner workspace because organization status is ACTIVE, onboarding is COMPLETE, and subscription status is ACTIVE.

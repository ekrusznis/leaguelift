tests:
  - displayName: "[SMOKE] Subscription state - Review step"
    id: subscription-review
    steps:
      - goal: >-
          Complete the first-launch walkthrough if needed and sign in with the supplied
          owner account pre-provisioned specifically in the review step state.
        hint: Do not change the account's subscription state during this test.
        finalScreenAssertion: >-
          The owner is routed directly to Review & Checkout and the native Owner workspace remains locked.

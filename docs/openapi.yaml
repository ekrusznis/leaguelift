openapi: 3.0.3
info:
  title: LeagueLift API
  description: >
    LeagueLift revenue, fundraising, commerce, and fee-management API for youth sports
    organizations. This document covers Phase 0 (foundation), Phase 1 (organization
    onboarding, teams, tournaments, and public pages), and Phase 2 (households,
    participants, fee templates, and fee assignments). Endpoints are added milestone
    by milestone — do not add backend endpoints without updating this document in the
    same change (DESIGN-DOC.md section 26.4).
  version: "0.5.0"
servers:
  - url: /api/v1
tags:
  - name: system
  - name: identity
  - name: organizations
  - name: members
  - name: invitations
  - name: teams
  - name: tournaments
  - name: public-pages
  - name: households
  - name: participants
  - name: fees
paths:
  /public/status:
    get:
      tags: [system]
      summary: Public liveness/status check
      operationId: getPublicStatus
      security: []
      responses:
        "200":
          description: Service is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /bootstrap:
    post:
      tags: [identity]
      summary: Provision the authenticated identity-provider subject as an internal app_user
      description: >
        Idempotent. If an app_user already exists for the caller's external subject,
        returns it unchanged; otherwise creates it.
      operationId: bootstrapCurrentUser
      responses:
        "200":
          description: Current user provisioned/retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [identity]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations:
    get:
      tags: [organizations]
      summary: List organizations the current user is a member of
      operationId: listOrganizations
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [organizations]
      summary: Create an organization
      description: The creator is granted the OWNER membership role.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [organizations]
      summary: Get an organization by ID
      operationId: getOrganization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [organizations]
      summary: Update an organization
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [members]
      summary: List members of an organization
      operationId: listOrganizationMembers
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [members]
      summary: Change a member's role
      description: >
        Owner-only role is out of scope here — ownership transfer is a separate
        controlled workflow (DESIGN-DOC.md section 7.2). Only OWNER or ADMINISTRATOR
        callers may change other members' roles.
      operationId: updateMembershipRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipRoleRequest"
      responses:
        "204":
          description: Role updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [members]
      summary: Revoke a member's access
      operationId: revokeMembership
      responses:
        "204":
          description: Membership revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/onboarding:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [organizations]
      summary: Get the organization's onboarding checklist status
      operationId: getOnboardingProgress
      responses:
        "200":
          description: Onboarding progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgressResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [invitations]
      summary: List pending administrator invitations
      operationId: listInvitations
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of pending invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [invitations]
      summary: Invite an adult administrator to the organization
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created. The response includes the raw token once —
            it is not retrievable afterward.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [invitations]
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      responses:
        "204":
          description: Invitation revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /invitations/{token}/accept:
    post:
      tags: [invitations]
      summary: Accept an invitation as the currently authenticated user
      description: >
        The invitation's email must match the caller's own account email. Not nested
        under /organizations/{organizationId} because the caller does not have
        membership in that organization yet.
      operationId: acceptInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted; membership granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Invitation email does not match the caller's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Teams ---

  /organizations/{organizationId}/teams:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [teams]
      summary: List active teams
      operationId: listTeams
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of active teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [teams]
      summary: Create a team
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A team with this name already exists in the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/TeamIdParam"
    get:
      tags: [teams]
      summary: Get a team by ID
      operationId: getTeam
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [teams]
      summary: Update a team
      operationId: updateTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [teams]
      summary: Archive a team
      operationId: archiveTeam
      responses:
        "204":
          description: Team archived
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Tournaments ---

  /organizations/{organizationId}/tournaments:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [tournaments]
      summary: List active tournaments
      operationId: listTournaments
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of active tournaments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [tournaments]
      summary: Create a tournament
      operationId: createTournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTournamentRequest"
      responses:
        "201":
          description: Tournament created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A tournament with this name already exists in the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/tournaments/{tournamentId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/TournamentIdParam"
    get:
      tags: [tournaments]
      summary: Get a tournament by ID
      operationId: getTournament
      responses:
        "200":
          description: Tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [tournaments]
      summary: Update a tournament
      operationId: updateTournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTournamentRequest"
      responses:
        "200":
          description: Updated tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [tournaments]
      summary: Archive a tournament
      operationId: archiveTournament
      responses:
        "204":
          description: Tournament archived
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Public pages ---

  /organizations/{organizationId}/pages:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [public-pages]
      summary: List all public pages for the organization
      operationId: listPublicPages
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of public pages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPagePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [public-pages]
      summary: Create a public page for an entity
      operationId: createPublicPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicPageRequest"
      responses:
        "201":
          description: Public page created in DRAFT status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A page for this entity or slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/pages/{pageId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/PageIdParam"
    get:
      tags: [public-pages]
      summary: Get a page by ID
      operationId: getPublicPage
      responses:
        "200":
          description: Public page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [public-pages]
      summary: Update page title, slug, or summary
      operationId: updatePublicPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePublicPageRequest"
      responses:
        "200":
          description: Updated page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/pages/{pageId}/publish:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/PageIdParam"
    post:
      tags: [public-pages]
      summary: Publish a page (DRAFT → PUBLISHED)
      operationId: publishPage
      responses:
        "200":
          description: Page published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/pages/{pageId}/unpublish:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/PageIdParam"
    post:
      tags: [public-pages]
      summary: Unpublish a page (PUBLISHED → DRAFT)
      operationId: unpublishPage
      responses:
        "200":
          description: Page unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/pages/{slug}:
    get:
      tags: [public-pages]
      summary: Get a published public page by slug (no auth required)
      operationId: getPublicPageBySlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Households ---

  /organizations/{organizationId}/households:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [households]
      summary: List active households
      operationId: listHouseholds
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of active households
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [households]
      summary: Create a household
      operationId: createHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
      responses:
        "201":
          description: Household created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/households/{householdId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/HouseholdIdParam"
    get:
      tags: [households]
      summary: Get a household by ID
      operationId: getHousehold
      responses:
        "200":
          description: Household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [households]
      summary: Update a household
      operationId: updateHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseholdRequest"
      responses:
        "200":
          description: Updated household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/households/{householdId}/adults:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/HouseholdIdParam"
    get:
      tags: [households]
      summary: List active adults in a household
      operationId: listHouseholdAdults
      responses:
        "200":
          description: List of active household adults
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HouseholdAdultResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [households]
      summary: Add an adult to a household
      operationId: addHouseholdAdult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddHouseholdAdultRequest"
      responses:
        "201":
          description: Adult added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdAdultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/households/{householdId}/adults/{adultId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/HouseholdIdParam"
      - name: adultId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [households]
      summary: Remove (archive) an adult from a household
      operationId: removeHouseholdAdult
      responses:
        "204":
          description: Adult removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Participants ---

  /organizations/{organizationId}/households/{householdId}/participants:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/HouseholdIdParam"
    get:
      tags: [participants]
      summary: List active participants in a household
      operationId: listParticipants
      responses:
        "200":
          description: List of active participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParticipantResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [participants]
      summary: Add a participant to a household
      operationId: createParticipant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateParticipantRequest"
      responses:
        "201":
          description: Participant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/participants/{participantId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/ParticipantIdParam"
    patch:
      tags: [participants]
      summary: Update a participant's profile
      operationId: updateParticipant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateParticipantRequest"
      responses:
        "200":
          description: Updated participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/participants/{participantId}/teams:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/ParticipantIdParam"
    get:
      tags: [participants]
      summary: List active team assignments for a participant
      operationId: listParticipantTeams
      responses:
        "200":
          description: List of active team assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParticipantTeamResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [participants]
      summary: Assign a participant to a team
      operationId: assignParticipantToTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTeamRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantTeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Participant is already assigned to this team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/participants/{participantId}/teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/ParticipantIdParam"
      - $ref: "#/components/parameters/TeamIdParam"
    delete:
      tags: [participants]
      summary: Remove a participant from a team
      operationId: removeParticipantFromTeam
      responses:
        "204":
          description: Assignment removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Fee Templates ---

  /organizations/{organizationId}/fee-templates:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [fees]
      summary: List active fee templates
      operationId: listFeeTemplates
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of active fee templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeTemplatePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [fees]
      summary: Create a fee template
      operationId: createFeeTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeeTemplateRequest"
      responses:
        "201":
          description: Fee template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeTemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/fee-templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/FeeTemplateIdParam"
    get:
      tags: [fees]
      summary: Get a fee template by ID
      operationId: getFeeTemplate
      responses:
        "200":
          description: Fee template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeTemplateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [fees]
      summary: Update a fee template
      operationId: updateFeeTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeeTemplateRequest"
      responses:
        "200":
          description: Updated fee template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeTemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [fees]
      summary: Archive a fee template
      operationId: archiveFeeTemplate
      responses:
        "204":
          description: Template archived
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Fee Assignments ---

  /organizations/{organizationId}/households/{householdId}/fee-assignments:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/HouseholdIdParam"
    get:
      tags: [fees]
      summary: List fee assignments for a household
      operationId: listFeeAssignments
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of fee assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeAssignmentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [fees]
      summary: Assign a fee to a household
      operationId: createFeeAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeeAssignmentRequest"
      responses:
        "201":
          description: Fee assignment created with OPEN status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/fee-assignments/{assignmentId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/FeeAssignmentIdParam"
    get:
      tags: [fees]
      summary: Get a fee assignment by ID
      operationId: getFeeAssignment
      responses:
        "200":
          description: Fee assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeAssignmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/fee-assignments/{assignmentId}/status:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/FeeAssignmentIdParam"
    patch:
      tags: [fees]
      summary: Update the status of a fee assignment
      description: >
        Fee assignment amounts are immutable (financial ledger). Only the
        status field may be changed via this endpoint.
      operationId: updateFeeAssignmentStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeeAssignmentStatusRequest"
      responses:
        "200":
          description: Fee assignment with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationIdParam:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamIdParam:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TournamentIdParam:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageIdParam:
      name: pageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HouseholdIdParam:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParticipantIdParam:
      name: participantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeeTemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeeAssignmentIdParam:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not authorized for this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found (or not visible to the caller)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        version:
          type: string
          example: "0.1.0"
    ErrorResponse:
      type: object
      required: [code, message, requestId, fieldErrors]
      properties:
        code:
          type: string
          example: ORGANIZATION_NOT_FOUND
        message:
          type: string
          example: The organization could not be found.
        requestId:
          type: string
          example: req_01hz8x9y2z
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    UserResponse:
      type: object
      required: [id, email, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
    CreateOrganizationRequest:
      type: object
      required: [name, slug, organizationType]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
        sports:
          type: array
          items:
            type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          maxLength: 40
    OrganizationType:
      type: string
      enum:
        - RECREATIONAL_LEAGUE
        - TRAVEL_CLUB
        - INDIVIDUAL_TEAM
        - TOURNAMENT_OPERATOR
        - BOOSTER_ORGANIZATION
        - MULTISPORT_FACILITY
        - COMMUNITY_PROGRAM
        - OTHER
    OrganizationResponse:
      type: object
      required: [id, name, slug, organizationType, status, sports, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, ARCHIVED]
        sports:
          type: array
          items:
            type: string
        contactEmail:
          type: string
          format: email
          nullable: true
        contactPhone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    MembershipRole:
      type: string
      enum:
        - OWNER
        - ADMINISTRATOR
        - FINANCE_MANAGER
        - TEAM_ADMINISTRATOR
        - TOURNAMENT_ADMINISTRATOR
        - VIEWER
    MembershipResponse:
      type: object
      required: [id, organizationId, userId, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          type: string
          enum: [ACTIVE, INVITED, REVOKED]
        createdAt:
          type: string
          format: date-time
    MembershipPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MembershipResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    UpdateMembershipRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/MembershipRole"
    OnboardingProgressResponse:
      type: object
      required: [profileComplete, hasAdditionalAdministrator]
      properties:
        profileComplete:
          type: boolean
          description: Organization has at least one sport and a contact email set.
        hasAdditionalAdministrator:
          type: boolean
          description: The organization has more than just its original owner as a member.
    InvitableMembershipRole:
      type: string
      description: MembershipRole minus OWNER — ownership transfer is a separate workflow.
      enum:
        - ADMINISTRATOR
        - FINANCE_MANAGER
        - TEAM_ADMINISTRATOR
        - TOURNAMENT_ADMINISTRATOR
        - VIEWER
    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/InvitableMembershipRole"
    InvitationResponse:
      type: object
      required: [id, organizationId, email, role, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateInvitationResponse:
      type: object
      required: [invitation, token]
      properties:
        invitation:
          $ref: "#/components/schemas/InvitationResponse"
        token:
          type: string
          description: Raw invitation token, returned only once at creation time. Use it
            to build the accept link (e.g. app.leaguelift.com/invitations/{token}).
    InvitationPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvitationResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    # --- Team schemas ---
    CreateTeamRequest:
      type: object
      required: [name, sport]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sport:
          type: string
          minLength: 1
          maxLength: 60
        season:
          type: string
          maxLength: 60
          nullable: true
        contactEmail:
          type: string
          format: email
          nullable: true
    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sport:
          type: string
          minLength: 1
          maxLength: 60
        season:
          type: string
          nullable: true
        contactEmail:
          type: string
          format: email
          nullable: true
    TeamResponse:
      type: object
      required: [id, organizationId, name, sport, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        sport:
          type: string
        season:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        contactEmail:
          type: string
          format: email
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeamPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer

    # --- Tournament schemas ---
    CreateTournamentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sport:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        location:
          type: string
          nullable: true
        contactEmail:
          type: string
          format: email
          nullable: true
    UpdateTournamentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sport:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        location:
          type: string
          nullable: true
        contactEmail:
          type: string
          format: email
          nullable: true
    TournamentResponse:
      type: object
      required: [id, organizationId, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        sport:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        location:
          type: string
          nullable: true
        contactEmail:
          type: string
          format: email
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TournamentPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TournamentResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer

    # --- Public page schemas ---
    CreatePublicPageRequest:
      type: object
      required: [pageType, entityId, slug, title]
      properties:
        pageType:
          type: string
          enum: [ORGANIZATION, TEAM, TOURNAMENT]
        entityId:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
          minLength: 3
          maxLength: 80
        title:
          type: string
          maxLength: 120
        summary:
          type: string
          maxLength: 500
          nullable: true
    UpdatePublicPageRequest:
      type: object
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
          minLength: 3
          maxLength: 80
        title:
          type: string
          maxLength: 120
        summary:
          type: string
          nullable: true
    PublicPageResponse:
      type: object
      required: [id, organizationId, pageType, entityId, slug, title, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        pageType:
          type: string
          enum: [ORGANIZATION, TEAM, TOURNAMENT]
        entityId:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

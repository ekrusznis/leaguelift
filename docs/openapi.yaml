          type: string
          description: >
            May contain the literal placeholder "{SPONSORSHIP_ID}", substituted
            server-side with the created sponsorship's id before being handed to
            Stripe as the Checkout Session's success_url (mirrors
            ContributionService's "{CONTRIBUTION_ID}" convention).
        cancelUrl:
          type: string

      parameters:
        - {in: path, name: organizationId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: scopeType, required: false, schema: {type: string, enum: [ORGANIZATION, TEAM]}}
        - {in: query, name: scopeId, required: false, schema: {type: string, format: uuid}}
        - {in: query, name: status, required: false, schema: {type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED]}}
        - {in: query, name: page, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: size, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 25}}
      responses:
        '200':
          description: Authorized safety review queue
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageSafetyReportPageResponse'}
  /organizations/{organizationId}/message-reports/{reportId}:
    patch:
      tags: [messaging]
      summary: Move a message safety report into review or close it with a recorded outcome
      parameters:
        - {in: path, name: organizationId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: reportId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewMessageSafetyReportRequest'}
      responses:
        '200':
          description: Updated safety report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageSafetyReportResponse'}
  /organizations/{organizationId}/message-reports/{reportId}/events:
    get:
      tags: [messaging]
      summary: List append-only moderation events for a message safety report
      parameters:
        - {in: path, name: organizationId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: reportId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Moderation history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MessageModerationEventResponse'}
  /organizations/{organizationId}/message-threads/{threadId}/safety-lock:
    post:
      tags: [messaging]
      summary: Temporarily pause all new messages in a thread for safety review
      parameters:
        - {in: path, name: organizationId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: threadId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SafetyLockThreadRequest'}
      responses:
        '200':
          description: Safety-locked thread
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageThreadResponse'}
  /organizations/{organizationId}/message-threads/{threadId}/safety-unlock:
    post:
      tags: [messaging]
      summary: Remove a thread safety lock after recording a review note
      parameters:
        - {in: path, name: organizationId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: threadId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SafetyUnlockThreadRequest'}
      responses:
        '200':
          description: Unlocked thread
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageThreadResponse'}

  /organizations/{organizationId}/messaging/safe-sport-policy:
    get:
      summary: Read the messaging SafeSport policy gate
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      responses:
        '200': {description: Policy gate, content: {application/json: {schema: {$ref: '#/components/schemas/MessageSafeSportPolicyResponse'}}}}
    patch:
      summary: Record the platform SafeSport/compliance review gate (platform administrator only)
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMessageSafeSportPolicyRequest'}}}}
      responses:
        '200': {description: Updated policy gate, content: {application/json: {schema: {$ref: '#/components/schemas/MessageSafeSportPolicyResponse'}}}}
  /me/messaging/guardian-participants:
    get:
      summary: List participants linked to the current guardian for messaging safety controls
      responses:
        '200': {description: Linked participants, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/GuardianMessagingParticipantResponse'}}}}}
  /me/messaging/contact-restrictions:
    get:
      summary: List guardian-created messaging contact restrictions
      responses:
        '200': {description: Restrictions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MessageContactRestrictionResponse'}}}}}
    post:
      summary: Record a guardian communication restriction
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateMessageContactRestrictionRequest'}}}}
      responses:
        '201': {description: Restriction recorded, content: {application/json: {schema: {$ref: '#/components/schemas/MessageContactRestrictionResponse'}}}}
  /me/messaging/contact-restrictions/{restrictionId}/lift:
    post:
      summary: Lift a guardian-created communication restriction while retaining history
      parameters:
        - {name: restrictionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LiftMessageContactRestrictionRequest'}}}}
      responses:
        '200': {description: Lifted restriction, content: {application/json: {schema: {$ref: '#/components/schemas/MessageContactRestrictionResponse'}}}}

  /me/messaging/athlete-teams:
    get:
      summary: List current athlete team contexts and whether athlete messaging is enabled
      responses:
        '200': {description: Athlete teams, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AthleteMessagingTeamResponse'}}}}}
  /me/messaging/athlete-contacts:
    get:
      summary: List eligible same-team athlete peers for a gated athlete conversation
      parameters:
        - {name: organizationId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: teamId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Eligible peers, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ConversationContactResponse'}}}}}
  /me/messaging/athlete-conversations:
    post:
      summary: Create a gated athlete direct/group conversation
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateAthleteConversationRequest'}}}}
      responses:
        '201': {description: Athlete conversation created, content: {application/json: {schema: {$ref: '#/components/schemas/MessageThreadResponse'}}}}

  /me/preferences:
    get:
      tags: [settings]
      summary: Get the signed-in user's typed personal preferences
      operationId: getMyPreferences
      responses:
        "200":
          description: Personal preferences. Missing persisted rows resolve to System appearance.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserPreferenceResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      tags: [settings]
      summary: Update the signed-in user's typed personal preferences
      description: Phase 28.1 accepts only the account appearance preference. Notification preferences use a separate typed model in Phase 28.2.
      operationId: updateMyPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateUserPreferenceRequest"}
      responses:
        "200":
          description: Updated personal preferences
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserPreferenceResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /platform/admin/data-integrity/duplicates:
    get:
      summary: List duplicate identity candidate groups
      description: Platform Admin-only normalized email/phone duplicate scan across app users and unlinked guardian shells. The scan itself is read-only; resolution uses the separate preview-bound POST endpoint.
      parameters:
        - {name: query, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Duplicate identity candidates, content: {application/json: {schema: {$ref: '#/components/schemas/DuplicateCandidateListResponse'}}}}
        '403': {description: Platform user-view capability required}
  /platform/admin/data-integrity/duplicates/preview:
    get:
      summary: Build a duplicate resolution preview
      description: Inventories source dependencies, revalidates shared normalized duplicate evidence, identifies one safe support-session organization scope, and returns a deterministic preview hash plus plan items/blockers.
      parameters:
        - {name: sourceKind, in: query, required: true, schema: {type: string, enum: [APP_USER, GUARDIAN_SHELL]}}
        - {name: sourceId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: targetKind, in: query, required: true, schema: {type: string, enum: [APP_USER, GUARDIAN_SHELL]}}
        - {name: targetId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Resolution preview, content: {application/json: {schema: {$ref: '#/components/schemas/DuplicateMergePreviewResponse'}}}}
        '400': {description: Invalid source/target pair}
        '403': {description: Platform user-view capability required}
        '404': {description: Identity not found}
  /platform/admin/data-integrity/duplicates/resolve:
    post:
      summary: Execute an audited duplicate identity resolution
      description: Platform Admin-only mutation. Requires PLATFORM_USER_MANAGE and PLATFORM_SUPPORT_ACCESS, an active support session for the preview's single organization scope, a current preview hash, an action reason, and typed confirmation of the surviving target email. The server locks and rebuilds the preview before writing; stale or newly blocked plans fail atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveDuplicateIdentityRequest'}
      responses:
        '200': {description: Completed or idempotently replayed resolution receipt, content: {application/json: {schema: {$ref: '#/components/schemas/IdentityResolutionReceiptResponse'}}}}
        '400': {description: Invalid confirmation, reason, preview hash, or source/target pair}
        '403': {description: Platform manage/support capability or active support-session scope required}
        '404': {description: Identity not found}
        '409': {description: Preview stale, resolution blocked, source already resolved differently, or relationships changed during mutation}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationIdParam:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlatformSupportAccessHeader:
      name: X-Rally26-Support-Access
      in: header
      required: true
      description: Active, organization-scoped Platform Admin support-access session id. Required only when a PLATFORM_ADMIN calls an
        organization-prefixed customer endpoint or a resource-first team, tournament, household, participant, event, RSVP, or calendar
        endpoint for the same organization.
      schema:
        type: string
        format: uuid
    TeamIdParam:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TournamentIdParam:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageIdParam:
      name: pageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HouseholdIdParam:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParticipantIdParam:
      name: participantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeeTemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeeAssignmentIdParam:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentIdParam:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdjustmentIdParam:
      name: adjustmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignIdParam:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetIdParam:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UsageSlotParam:
      name: usageSlot
      in: path
      required: true
      schema:
        type: string
        enum: [LOGO, COVER, PROFILE_PHOTO, PRODUCT_DESIGN, SPONSOR_LOGO, DOCUMENT]
    MediaEntityTypeParam:
      name: entityType
      in: path
      required: true
      schema:
        type: string
        enum: [ORGANIZATION, TEAM, TOURNAMENT, HOUSEHOLD_ADULT, PARTICIPANT]
    MediaEntityIdParam:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SponsorshipPackageIdParam:
      name: packageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SponsorIdParam:
      name: sponsorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SponsorshipIdParam:
      name: sponsorshipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StoreIdParam:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductIdParam:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AthleteStorefrontIdParam:
      name: storefrontId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SupportArticleSlugParam:
      name: slug
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 120}
    SupportArticleIdParam:
      name: articleId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SupportCaseIdParam:
      name: caseId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AnnouncementIdParam:
      name: announcementId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not authorized for this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found (or not visible to the caller)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The requested change conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PrintifyUnavailable:
      description: The Printify API is not available right now (e.g. no PRINTIFY_API_TOKEN configured)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: The upstream integration provider is not available right now (e.g. disabled, unconfigured, or a stub/local-only provider outside dev)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AppearancePreference:
      type: string
      enum: [SYSTEM, LIGHT, DARK]
      description: Account-level authenticated UI appearance. SYSTEM follows the current device preference.
    UserPreferenceResponse:
      type: object
      required: [appearance]
      properties:
        appearance: {$ref: "#/components/schemas/AppearancePreference"}
    UpdateUserPreferenceRequest:
      type: object
      additionalProperties: false
      required: [appearance]
      properties:
        appearance: {$ref: "#/components/schemas/AppearancePreference"}
    DuplicateIdentityRefResponse:
      type: object
      required: [kind, id]
      properties:
        kind: {type: string, enum: [APP_USER, GUARDIAN_SHELL]}
        id: {type: string, format: uuid}
    DuplicateMembershipResponse:
      type: object
      required: [organizationId, organizationName, role, status]
      properties:
        organizationId: {type: string, format: uuid}
        organizationName: {type: string}
        role: {type: string}
        status: {type: string}
    DuplicateRoleAssignmentResponse:
      type: object
      required: [organizationId, contextType, resourceId, role]
      properties:
        organizationId: {type: string, format: uuid}
        contextType: {type: string}
        resourceId: {type: string, format: uuid}
        role: {type: string}
    DuplicateGuardianLinkResponse:
      type: object
      required: [organizationId, householdId, householdAdultId]
      properties:
        organizationId: {type: string, format: uuid}
        householdId: {type: string, format: uuid}
        householdAdultId: {type: string, format: uuid}
    DuplicateIdentityResponse:
      type: object
      required: [ref, displayName, status, createdAt, platformAdministrator, memberships, externalIds, roleAssignments, guardianLinks]
      properties:
        ref: {$ref: '#/components/schemas/DuplicateIdentityRefResponse'}
        displayName: {type: string}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        status: {type: string}
        createdAt: {type: string, format: date-time}
        organizationId: {type: string, format: uuid, nullable: true}
        organizationName: {type: string, nullable: true}
        householdId: {type: string, format: uuid, nullable: true}
        householdName: {type: string, nullable: true}
        linkedUserId: {type: string, format: uuid, nullable: true}
        platformAdministrator: {type: boolean}
        memberships: {type: array, items: {$ref: '#/components/schemas/DuplicateMembershipResponse'}}
        externalIds: {type: array, items: {type: string}}
        roleAssignments: {type: array, items: {$ref: '#/components/schemas/DuplicateRoleAssignmentResponse'}}
        guardianLinks: {type: array, items: {$ref: '#/components/schemas/DuplicateGuardianLinkResponse'}}
        mergedIntoUserId: {type: string, format: uuid, nullable: true}
    DuplicateCandidateGroupResponse:
      type: object
      required: [matchType, normalizedValue, identities]
      properties:
        matchType: {type: string, enum: [EMAIL, PHONE]}
        normalizedValue: {type: string}
        identities: {type: array, minItems: 2, items: {$ref: '#/components/schemas/DuplicateIdentityResponse'}}
    DuplicateCandidateListResponse:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DuplicateCandidateGroupResponse'}}
    IdentityDependencyResponse:
      type: object
      required: [tableName, columnName, count, historical]
      properties:
        tableName: {type: string}
        columnName: {type: string}
        count: {type: integer, format: int64}
        historical: {type: boolean}
    DuplicateMatchEvidenceResponse:
      type: object
      required: [matchType, normalizedValue]
      properties:
        matchType: {type: string, enum: [EMAIL, PHONE]}
        normalizedValue: {type: string}
    MergePlanItemResponse:
      type: object
      required: [code, severity, summary]
      properties:
        code: {type: string}
        severity: {type: string, enum: [INFO, WARNING, BLOCKER]}
        summary: {type: string}
    DuplicateMergePreviewResponse:
      type: object
      required: [source, target, strategy, canProceedToMutationSlice, dependencies, sharedEvidence, plan, previewHash]
      properties:
        source: {$ref: '#/components/schemas/DuplicateIdentityResponse'}
        target: {$ref: '#/components/schemas/DuplicateIdentityResponse'}
        strategy: {type: string, enum: [LINK_SHELL_TO_EXISTING_USER, MERGE_USER_ACCOUNTS, REVIEW_SHELLS_SEPARATELY, KEEP_SEPARATE]}
        canProceedToMutationSlice: {type: boolean}
        dependencies: {type: array, items: {$ref: '#/components/schemas/IdentityDependencyResponse'}}
        sharedEvidence: {type: array, items: {$ref: '#/components/schemas/DuplicateMatchEvidenceResponse'}}
        plan: {type: array, items: {$ref: '#/components/schemas/MergePlanItemResponse'}}
        requiredSupportOrganizationId: {type: string, format: uuid, nullable: true}
        previewHash: {type: string, pattern: '^[0-9a-f]{64}$'}
    ResolveDuplicateIdentityRequest:
      type: object
      required: [sourceKind, sourceId, targetKind, targetId, previewHash, supportAccessId, reason, confirmedTargetEmail]
      properties:
        sourceKind: {type: string, enum: [APP_USER, GUARDIAN_SHELL]}
        sourceId: {type: string, format: uuid}
        targetKind: {type: string, enum: [APP_USER, GUARDIAN_SHELL]}
        targetId: {type: string, format: uuid}
        previewHash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        supportAccessId: {type: string, format: uuid}
        reason: {type: string, minLength: 10, maxLength: 500}
        confirmedTargetEmail: {type: string, format: email}
    IdentityResolutionOutcomeResponse:
      type: object
      required: [membershipsMoved, membershipsDeduplicated, roleAssignmentsMoved, roleAssignmentsDeduplicated, guardianRelationshipsMoved, guardianRelationshipsDeduplicated, messageThreadMembershipsMoved, messageThreadMembershipsDeduplicated, messageRecipientAccessMoved, messageRecipientAccessAlreadyPresent, announcementRecipientAccessMoved, announcementRecipientAccessAlreadyPresent, guardianRelationshipCreated, authTokensInvalidated]
      properties:
        membershipsMoved: {type: integer, minimum: 0}
        membershipsDeduplicated: {type: integer, minimum: 0}
        roleAssignmentsMoved: {type: integer, minimum: 0}
        roleAssignmentsDeduplicated: {type: integer, minimum: 0}
        guardianRelationshipsMoved: {type: integer, minimum: 0}
        guardianRelationshipsDeduplicated: {type: integer, minimum: 0}
        messageThreadMembershipsMoved: {type: integer, minimum: 0}
        messageThreadMembershipsDeduplicated: {type: integer, minimum: 0}
        messageRecipientAccessMoved: {type: integer, minimum: 0}
        messageRecipientAccessAlreadyPresent: {type: integer, minimum: 0}
        announcementRecipientAccessMoved: {type: integer, minimum: 0}
        announcementRecipientAccessAlreadyPresent: {type: integer, minimum: 0}
        guardianRelationshipCreated: {type: boolean}
        authTokensInvalidated: {type: integer, minimum: 0}
    IdentityResolutionReceiptResponse:
      type: object
      required: [operationId, operationType, status, source, target, organizationId, supportAccessId, previewHash, completedAt, outcome]
      properties:
        operationId: {type: string, format: uuid}
        operationType: {type: string, enum: [LINK_GUARDIAN_SHELL, MERGE_APP_USERS]}
        status: {type: string, enum: [COMPLETED, ROLLED_BACK]}
        source: {$ref: '#/components/schemas/DuplicateIdentityRefResponse'}
        target: {$ref: '#/components/schemas/DuplicateIdentityRefResponse'}
        organizationId: {type: string, format: uuid}
        supportAccessId: {type: string, format: uuid}
        previewHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        completedAt: {type: string, format: date-time}
        outcome: {$ref: '#/components/schemas/IdentityResolutionOutcomeResponse'}

    AuditResult:
      type: string
      enum: [SUCCESS, FAILURE, DENIED, PARTIAL]
    AuditHistorySortField:
      type: string
      enum: [DATE, ACTION, RESULT]
      default: DATE
    AuditHistorySortDirection:
      type: string
      enum: [ASC, DESC]
      default: DESC
    AuditHistoryFilterAccessResponse:
      type: object
      required: [canFilterUser, canFilterTeam, canFilterOrganization]
      properties:
        canFilterUser: {type: boolean}
        canFilterTeam: {type: boolean}
        canFilterOrganization: {type: boolean}
    AuditHistoryItemResponse:
      type: object
      required: [id, occurredAt, action, result, summary, actorType, entityType, entityId]
      properties:
        id: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        action: {type: string}
        result: {$ref: "#/components/schemas/AuditResult"}
        summary: {type: string}
        actorType: {type: string, enum: [USER, SYSTEM, PROVIDER]}
        actorUserId: {type: string, format: uuid, nullable: true}
        actorDisplayName: {type: string, nullable: true}
        targetUserId: {type: string, format: uuid, nullable: true}
        targetDisplayName: {type: string, nullable: true}
        organizationId: {type: string, format: uuid, nullable: true}
        organizationName: {type: string, nullable: true}
        teamId: {type: string, format: uuid, nullable: true}
        teamName: {type: string, nullable: true}
        householdId: {type: string, format: uuid, nullable: true}
        householdName: {type: string, nullable: true}
        participantId: {type: string, format: uuid, nullable: true}
        participantDisplayName: {type: string, nullable: true}
        entityType: {type: string}
        entityId: {type: string, format: uuid}
    AuditHistoryPageResponse:
      type: object
      required: [items, filterAccess]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AuditHistoryItemResponse"}
        nextCursor: {type: string, nullable: true}
        filterAccess: {$ref: "#/components/schemas/AuditHistoryFilterAccessResponse"}

    SupportAudience:
      type: string

openapi: 3.0.3
info:
  title: Rally26 API
  description: >
    Rally26 revenue, fundraising, commerce, and fee-management API for youth sports
    organizations. This document covers Phase 0 (foundation), Phase 1 (organization
    onboarding, teams, tournaments, and public pages), Phase 2 (households,
    participants, fee templates, and fee assignments), Phase 3 slice 11
    (fundraising campaigns and their public pages) plus its remainder (campaign
    contribution recording via test-mode Stripe Checkout, real raised totals, and
    an inbound Stripe webhook receiver — DESIGN-DOC.md section 8.5; family
    credit rules remain a later slice pending section 19.3's open questions),
    traditional email/password authentication (superseding
    the originally planned external-IdP/Auth0 approach — see DESIGN-DOC.md section
    11.5), Phase 1's remaining file-upload/branding slice (organization logo/cover
    image via S3-compatible object storage — DESIGN-DOC.md section 11, ADR-012), and
    Phase 2's remainder (manual/offline fee payments, manual discounts/credits,
    org-wide collections listing and CSV export, and Stripe Connect Express
    onboarding-only scaffolding — DESIGN-DOC.md section 14.3, ADR-005 — no live
    charge routing yet), and Phase 4 slice 1 (apparel commerce proof: stores,
    Printify-catalog-backed products/variants with real Printify cost snapshots,
    a Printify catalog read proxy, multi-item test-mode Stripe Checkout with US
    shipping-address collection, and draft-only Printify order submission on
    confirmation — ADR-016; auto-design/personalization and cross-provider price
    comparison are explicitly out of scope, see the ADR), Phase 5 slice 1
    (ledger, real Stripe Connect Transfer payouts, and org-admin-initiated
    refunds — ADR-017), Phase 6 slice 1 (sponsorships proof-of-concept:
    org-published fixed-price sponsorship packages, test-mode Stripe Checkout
    purchase, ledger entries reusing the CONTRIBUTION shape with a new
    SPONSORSHIP source type, a public sponsor directory, and admin-side sponsor
    logo assignment — no public self-service logo upload and no refunds this
    slice, see ADR-018), and Phase 6's remainder (org-admin approval workflow
    gating public sponsor-directory visibility, refunds including an atomic
    reject-triggers-refund flow, a minimal scheduled renewal-reminder job,
    stateless QR/link sharing, computed receipt-style invoices, and
    sponsor-contact CRM widening — ADR-019), and Phase 8 slice 1 (the outbox
    worker's platform-admin dead-letter/failed inspection and reprocess
    endpoints — ADR-022; the outbox worker itself and the real Resend-backed
    EmailProvider have no endpoints of their own, they run in the background).
    Phase 9 (org/household/platform reporting endpoints, plus an
    AnalyticsProvider seam with a logging-only implementation — no real
    analytics vendor chosen yet — ADR-025), Phase 10 slice 1 (event CRUD
    — create/read/update/publish/cancel/postpone, org/team/tournament-scoped
    — ADR-026), and Phase 10 slice 2 (RSVP — submit/update via self/guardian/
    admin, staff individual-response + summary view, guardian/athlete
    summary-only view, household/participant combined-schedule listing —
    ADR-027), and Phase 10 slice 3 (a real `.ics` calendar export for a
    single event or a household's combined schedule, plus a real Google
    Maps directions link builder — neither is a logging stopgap, both are
    fully functional today — ADR-028), and Phase 10 slice 4 (notification
    wiring into the outbox worker for event/RSVP changes — no new endpoints,
    pure backend event-producer/consumer wiring — ADR-029), completing
    Phase 10. Phase 12 slice 1 (the Integrations page's org-connected
    event-source connections — list/connect-ICS-feed/disconnect; only
    ICS_FEED has a real connect flow this slice, the not-yet-integrated
    vendors are handled entirely client-side as disabled "coming soon"
    cards with no backend endpoint of their own — ADR-031), and Phase 12
    slice 2 (CSV schedule import — one upload scoped to one team-or-org-wide
    and one shared timezone, `external_id`-keyed dedup against the same
    `(provider, connection_id, external_event_id)` identity model Phase 10
    reserved, row-level errors collected without aborting the batch —
    ADR-032). Phase 12 slice 3 adds `timezone`/`teamId` to the ICS Feed
    connect request and connection response (a gap in slice 1's original
    connect flow, fixed here rather than deferred) — the scheduled sync
    poller itself has no endpoint of its own, it runs in the background
    like the outbox worker (ADR-033). Phase 12 slice 4 adds a
    detach-from-source endpoint, completing Phase 12 — an imported
    event's source-owned fields (opponent/start-end time/venue/status)
    can no longer be overwritten through the ordinary update endpoint;
    detaching first converts the event back to MANUAL (ADR-034).
    Phase 14 adds the Rally26 employee Platform Admin console: platform-wide
    organization and user directories, organization summaries, and reasoned,
    time-bounded support-access sessions. A Platform Admin remains the authenticated
    actor and is never silently converted into an organization member or customer.
    Customer-data requests require the support-access header on organization-prefixed
    routes and on resource-first team, tournament, household, participant, event, RSVP,
    and calendar routes carrying the target organizationId query parameter.
    Phase 24.6 plus the founder-requested Phase 26 billing pull-forward adds resumable
    owner onboarding, DRAFT organizations, backend-driven subscription plans, real Stripe
    subscription Checkout/Product/Price/Customer creation, billing portal sessions, and
    signed-webhook-authoritative organization activation.
    Endpoints are added milestone by milestone — do not add backend endpoints
    without updating this document in the same change (DESIGN-DOC.md section 26.4).
    Phase 17 now includes the Help Center/support foundation plus role-aware Action Center aggregation, one-way organization/team/tournament announcements,
    recipient-snapshotted in-app/email/SMS delivery, and campaign/event/fee/document reminders through one audited pipeline with idempotent resource
    creation (ADR-049/ADR-050). Phase 16 slices 3-6 extend the media pipeline to team/tournament branding and private adult/participant profile
    photos (ADR-045), add typed profile-correction requests (ADR-046), add manager-controlled reusable event templates that prefill ordinary manual
    draft events without recurrence or automatic publication (ADR-047), and complete the phase with preview-confirmed, idempotent season rollover
    limited to active roster links, explicit TEAM staff grants, and ready logo/cover assignments (ADR-048).
    Phase 19 slices 19.0-19.2 add the disabled-by-default provider catalog,
    generalized owner-scoped connection registry, sanitized readiness and connection
    APIs, OAuth authorization/callback/refresh/revoke/disconnect/health seams, encrypted
    credential references, hashed single-use state, PKCE, deterministic local stubs,
    and production fail-closed guards (ADR-054). No provider-specific production client
    or credential activation is claimed in this slice. Phase 24 slice 1 adds reusable
    organization/team Swag Brand Assets, product snapshot assignment, and a restore-to-draft
    archival lifecycle that hides archived products by default (ADR-067). Phase 24 slice 24.3
    adds a public, unauthenticated per-athlete Swag Shop storefront (a stable slug/QR-code page
    scoped to exactly one participant at publish time), a supporter checkout with a
    server-computed first-name-plus-last-initial privacy label so the real participant last name
    is never serialized, direct participant-to-household order attribution (no attribution-code
    indirection), family-credit grant/reversal wiring on order confirm/refund, and a guardian
    dashboard recent-orders card (ADR-069).
  version: "0.38.0"
servers:
- url: /api/v1
tags:
- name: system
- name: auth
- name: identity
- name: organizations
- name: members
- name: invitations
- name: teams
- name: tournaments
- name: public-pages
- name: households
- name: participants
- name: fees
- name: fundraising
- name: media
- name: payouts
- name: webhooks
- name: printify
- name: stores
- name: swag-brand-assets
- name: orders
- name: athlete-storefronts
- name: sponsorships
- name: dashboard
- name: outbox-admin
- name: authorization
- name: documents
- name: activity
- name: audit-history
- name: search
- name: reporting
- name: events
- name: integrations
- name: platform-admin
- name: onboarding
- name: messaging
- name: subscriptions
- name: season-rollovers
- name: help
- name: support-cases
- name: action-center
- name: announcements
- name: offline-finance
- name: settings
paths:
  /audit-history:
    get:
      tags: [audit-history]
      summary: List immutable role-scoped audit history
      description: >
        Visibility is enforced by current Rally26 relationships in SQL: athletes receive self/participant-scoped history;
        guardians receive self plus linked household/participant history; team staff receive assigned-team history;
        owners/administrators receive their organizations; Platform Administrators receive platform-wide history.
      operationId: listAuditHistory
      parameters:
      - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
      - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
      - {name: action, in: query, required: false, schema: {type: string, maxLength: 120}}
      - {name: result, in: query, required: false, schema: {$ref: "#/components/schemas/AuditResult"}}
      - {name: keyword, in: query, required: false, schema: {type: string, maxLength: 200}}
      - name: user
        in: query
        required: false
        description: User or participant display-name filter. Available to guardian and higher scopes; never widens visibility.
        schema: {type: string, maxLength: 120}
      - {name: organizationId, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: teamId, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: sortBy, in: query, required: false, schema: {$ref: "#/components/schemas/AuditHistorySortField"}}
      - {name: direction, in: query, required: false, schema: {$ref: "#/components/schemas/AuditHistorySortDirection"}}
      - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Role-scoped immutable audit history page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditHistoryPageResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /me/action-center:
    get:
      tags: [action-center]
      summary: Aggregate the signed-in user's current role-specific actions
      operationId: getMyActionCenter
      responses:
        "200":
          description: Current action items derived from source-of-truth records
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActionCenterResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /me/announcements:
    get:
      tags: [announcements]
      summary: List published announcements addressed to the signed-in user
      operationId: listMyAnnouncements
      parameters:
      - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200":
          description: Recipient-snapshotted in-app announcement inbox
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MyAnnouncementPageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /me/announcements/{announcementId}/read:
    post:
      tags: [announcements]
      summary: Mark one announcement addressed to the signed-in user as read
      operationId: markMyAnnouncementRead
      parameters:
      - $ref: "#/components/parameters/AnnouncementIdParam"
      responses:
        "204": {description: Announcement marked read}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /organizations/{organizationId}/announcements:
    get:
      tags: [announcements]
      summary: List announcements manageable in an authorized organization, team, or tournament scope
      operationId: listManagedAnnouncements
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - {name: scopeType, in: query, required: false, schema: {$ref: "#/components/schemas/AnnouncementScopeType"}}
      - {name: scopeId, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/AnnouncementStatus"}}
      - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200":
          description: Announcement management page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncementPageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [announcements]
      summary: Create an idempotent one-way announcement draft
      operationId: createAnnouncementDraft
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveAnnouncementRequest"}
      responses:
        "201":
          description: Announcement draft created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncementResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /organizations/{organizationId}/announcements/{announcementId}:
    get:
      tags: [announcements]
      summary: Read one manageable announcement
      operationId: getManagedAnnouncement
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/AnnouncementIdParam"
      responses:
        "200":
          description: Announcement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncementResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [announcements]
      summary: Update an announcement while it remains a draft
      operationId: updateAnnouncementDraft
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/AnnouncementIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateAnnouncementRequest"}
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncementResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /organizations/{organizationId}/announcements/{announcementId}/publish:
    post:
      tags: [announcements]
      summary: Snapshot recipients and publish a draft announcement once
      operationId: publishAnnouncement
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/AnnouncementIdParam"
      responses:
        "200":
          description: Published announcement with delivery counts
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncementResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /organizations/{organizationId}/announcements/{announcementId}/archive:
    post:
      tags: [announcements]
      summary: Archive a draft or published announcement without deleting its history
      operationId: archiveAnnouncement
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/AnnouncementIdParam"
      responses:
        "200":
          description: Archived announcement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncementResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /organizations/{organizationId}/reminders:
    post:
      tags: [announcements]
      summary: Publish an idempotent campaign, event, fee, or document reminder through the announcement pipeline
      operationId: sendResourceReminder
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SendReminderRequest"}
      responses:
        "201":
          description: Published reminder announcement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncementResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /public/help/articles:
    get:
      tags: [help]
      summary: Search published public help articles
      operationId: listPublicHelpArticles
      security: []
      parameters:
      - {name: query, in: query, required: false, schema: {type: string, maxLength: 120}}
      - {name: category, in: query, required: false, schema: {type: string, maxLength: 80}}
      responses:
        "200":
          description: Published PUBLIC articles matching the filters
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SupportArticleResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /public/help/articles/{slug}:
    get:
      tags: [help]
      summary: Read one published public help article
      operationId: getPublicHelpArticle
      security: []
      parameters:
      - $ref: "#/components/parameters/SupportArticleSlugParam"
      responses:
        "200":
          description: Published PUBLIC help article
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportArticleResponse"}
        "404": {$ref: "#/components/responses/NotFound"}

  /help/articles:
    get:
      tags: [help]
      summary: Search published help articles allowed for the caller's audiences
      operationId: listAuthenticatedHelpArticles
      parameters:
      - {name: query, in: query, required: false, schema: {type: string, maxLength: 120}}
      - {name: category, in: query, required: false, schema: {type: string, maxLength: 80}}
      responses:
        "200":
          description: Published audience-eligible articles
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SupportArticleResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /help/articles/{slug}:
    get:
      tags: [help]
      summary: Read one published help article allowed for the caller
      operationId: getAuthenticatedHelpArticle
      parameters:
      - $ref: "#/components/parameters/SupportArticleSlugParam"
      responses:
        "200":
          description: Published audience-eligible article
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportArticleResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /public/support-cases:
    post:
      tags: [support-cases]
      summary: Create a public support case
      description: Creates the durable case before queuing confirmation/routing email. Reusing the same idempotency key for the same public
        requester returns the existing case.
      operationId: createPublicSupportCase
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublicSupportCaseRequest"}
      responses:
        "200":
          description: Created case, or the existing idempotent result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportCaseResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}

  /support-cases:
    get:
      tags: [support-cases]
      summary: List the authenticated caller's support cases
      operationId: listMySupportCases
      parameters:
      - $ref: "#/components/parameters/PageParam"
      - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Caller-owned support cases
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportCasePageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [support-cases]
      summary: Create an authenticated support case
      description: The caller identity is bound automatically. An optional organization is accepted only when the caller has active
        membership.
      operationId: createAuthenticatedSupportCase
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthenticatedSupportCaseRequest"}
      responses:
        "200":
          description: Created case, or the existing idempotent result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportCaseResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /support-cases/{caseId}:
    get:
      tags: [support-cases]
      summary: Read one support case owned by the authenticated caller
      operationId: getMySupportCase
      parameters:
      - $ref: "#/components/parameters/SupportCaseIdParam"
      responses:
        "200":
          description: Caller-owned support case
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportCaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /platform/admin/help/articles:
    get:
      tags: [help, platform-admin]
      summary: Search all help article lifecycle states
      operationId: listPlatformHelpArticles
      parameters:
      - {name: query, in: query, required: false, schema: {type: string, maxLength: 120}}
      - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/SupportArticleStatus"}}
      - {name: audience, in: query, required: false, schema: {$ref: "#/components/schemas/SupportAudience"}}
      - {name: category, in: query, required: false, schema: {type: string, maxLength: 80}}
      - $ref: "#/components/parameters/PageParam"
      - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Platform help article page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportArticlePageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [help, platform-admin]
      summary: Create a draft help article
      operationId: createPlatformHelpArticle
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveSupportArticleRequest"}
      responses:
        "200":
          description: Created draft article
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportArticleResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /platform/admin/help/articles/{articleId}:
    put:
      tags: [help, platform-admin]
      summary: Update a non-archived help article
      operationId: updatePlatformHelpArticle
      parameters:
      - $ref: "#/components/parameters/SupportArticleIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveSupportArticleRequest"}
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportArticleResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /platform/admin/help/articles/{articleId}/publish:
    post:
      tags: [help, platform-admin]
      summary: Publish a help article
      operationId: publishPlatformHelpArticle
      parameters:
      - $ref: "#/components/parameters/SupportArticleIdParam"
      responses:
        "200":
          description: Published article
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportArticleResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /platform/admin/help/articles/{articleId}/archive:
    post:
      tags: [help, platform-admin]
      summary: Archive a help article
      operationId: archivePlatformHelpArticle
      parameters:
      - $ref: "#/components/parameters/SupportArticleIdParam"
      responses:
        "200":
          description: Archived article
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportArticleResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /platform/admin/support-cases:
    get:
      tags: [support-cases, platform-admin]
      summary: Search the Platform Admin support queue
      operationId: listPlatformSupportCases
      parameters:
      - {name: query, in: query, required: false, schema: {type: string, maxLength: 120}}
      - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/SupportCaseStatus"}}
      - {name: priority, in: query, required: false, schema: {$ref: "#/components/schemas/SupportCasePriority"}}
      - {name: category, in: query, required: false, schema: {$ref: "#/components/schemas/SupportCaseCategory"}}
      - {name: organizationId, in: query, required: false, schema: {type: string, format: uuid}}
      - $ref: "#/components/parameters/PageParam"
      - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Platform support-case page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportCasePageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /platform/admin/support-cases/{caseId}:
    get:
      tags: [support-cases, platform-admin]
      summary: Read one support case from the Platform Admin queue
      operationId: getPlatformSupportCase
      parameters:
      - $ref: "#/components/parameters/SupportCaseIdParam"
      responses:
        "200":
          description: Support case
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportCaseResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [support-cases, platform-admin]
      summary: Triage, assign, resolve, or close a support case
      operationId: updatePlatformSupportCase
      parameters:
      - $ref: "#/components/parameters/SupportCaseIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateSupportCaseRequest"}
      responses:
        "200":
          description: Updated support case
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportCaseResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /public/status:
    get:
      tags: [system]
      summary: Public liveness/status check
      operationId: getPublicStatus
      security: []
      responses:
        "200":
          description: Service is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /owner-onboarding:
    get:
      tags: [onboarding]
      summary: Resume the signed-in organization owner's durable onboarding state
      operationId: getOwnerOnboarding
      responses:
        "200":
          description: Current onboarding, draft organization, and subscription state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerOnboardingResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /owner-onboarding/plans:
    get:
      tags: [onboarding, subscriptions]
      summary: List active backend-owned organization subscription plans
      operationId: listOwnerOnboardingPlans
      responses:
        "200":
          description: Active plan cards, including contact-only options
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SubscriptionPlanResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /owner-onboarding/timezone-suggestion:
    get:
      tags: [onboarding]
      summary: Suggest an IANA timezone from the entered country/state for owner confirmation
      operationId: suggestOwnerOnboardingTimezone
      parameters:
      - {name: country, in: query, required: false, schema: {type: string}}
      - {name: state, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Suggestion only; null means Rally26 will not guess
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TimezoneSuggestionResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /owner-onboarding/organization:
    put:
      tags: [onboarding]
      summary: Create or update the owner's one DRAFT organization and advance to Plan
      operationId: saveOwnerOnboardingOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveOwnerOrganizationRequest"}
      responses:
        "200":
          description: Saved resumable onboarding state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerOnboardingResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /owner-onboarding/plan:
    put:
      tags: [onboarding, subscriptions]
      summary: Select the backend-owned monthly plan for the draft organization
      operationId: selectOwnerOnboardingPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SelectOwnerPlanRequest"}
      responses:
        "200":
          description: Plan saved; onboarding is ready for review/checkout
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerOnboardingResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /owner-onboarding/checkout:
    post:
      tags: [onboarding, subscriptions]
      summary: Create or resume a real Stripe subscription Checkout session
      description: >
        Creates/reuses the Stripe Product, recurring Price, Customer, and an open
        subscription-mode Checkout Session using the configured Stripe account. Browser
        success never activates the organization; only signed subscription webhooks do.
      operationId: startOwnerSubscriptionCheckout
      responses:
        "200":
          description: Hosted Stripe Checkout destination
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubscriptionCheckoutResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /organizations/{organizationId}/subscription:
    get:
      tags: [subscriptions]
      summary: Read the owner-visible organization subscription status
      operationId: getOrganizationSubscription
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: Subscription state, or null before checkout starts
          content:
            application/json:
              schema:
                allOf: [{$ref: "#/components/schemas/OrganizationSubscriptionResponse"}]
                nullable: true
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /organizations/{organizationId}/subscription/portal:
    post:
      tags: [subscriptions]
      summary: Create a Stripe Billing Portal session for the organization owner
      operationId: createOrganizationBillingPortal
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: Stripe-hosted billing-management URL
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingPortalResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /platform/admin/subscriptions:
    get:
      tags: [subscriptions, platform-admin]
      summary: List organization subscription states for Platform Admin support
      description: Read-only sanitized billing visibility. Includes organizations that have not started subscription checkout.
      operationId: listPlatformOrganizationSubscriptions
      parameters:
      - {name: query, in: query, required: false, schema: {type: string}}
      - name: status
        in: query
        required: false
        schema: {type: string, enum: [NONE, CHECKOUT_PENDING, TRIALING, ACTIVE, PAST_DUE, CANCELED, INCOMPLETE]}
      - {$ref: "#/components/parameters/PageParam"}
      - {$ref: "#/components/parameters/SizeParam"}
      responses:
        "200":
          description: Paginated organization billing states
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformOrganizationSubscriptionPageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "400": {$ref: "#/components/responses/BadRequest"}
  /auth/register:
    post:
      tags: [auth]
      summary: Register an organization-owner account (legacy alias)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Registration accepted. Verification email queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with that email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register-owner:
    post:
      tags: [auth]
      summary: Register an organization-owner account
      operationId: registerOwner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Registration accepted. Verification email queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with that email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verify a newly-registered owner account email link
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: Email verified
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Request another owner verification email
      operationId: resendVerificationEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "204":
          description: Request accepted. Response is intentionally non-enumerating.
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/password-reset/request:
    post:
      tags: [auth]
      summary: Request a password reset email
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Request accepted. Response is intentionally non-enumerating.
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/password-reset/complete:
    post:
      tags: [auth]
      summary: Complete password reset with a one-time token
      operationId: completePasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "204":
          description: Password updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with an email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email/password or account not yet verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bootstrap:
    post:
      tags: [identity]
      summary: Get the current authenticated user (idempotent; kept for client compatibility with /me)
      operationId: bootstrapCurrentUser
      responses:
        "200":
          description: Current user provisioned/retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [identity]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations:
    get:
      tags: [organizations]
      summary: List organizations the current user is a member of
      operationId: listOrganizations
      parameters:
      - $ref: "#/components/parameters/PageParam"
      - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [organizations]
      summary: Create an organization
      description: The creator is granted the OWNER membership role.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [organizations]
      summary: Get an organization by ID
      operationId: getOrganization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [organizations]
      summary: Update an organization
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/members:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [members]
      summary: List members of an organization
      operationId: listOrganizationMembers
      parameters:
      - $ref: "#/components/parameters/PageParam"
      - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/members/{memberId}:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags: [members]
      summary: Change a member's role
      description: >
        Owner-only role is out of scope here — ownership transfer is a separate
        controlled workflow (DESIGN-DOC.md section 7.2). Only OWNER or ADMINISTRATOR
        callers may change other members' roles.
      operationId: updateMembershipRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipRoleRequest"
      responses:
        "204":
          description: Role updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [members]
      summary: Revoke a member's access
      operationId: revokeMembership
      responses:
        "204":
          description: Membership revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/onboarding:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [organizations]
      summary: Get the organization's onboarding checklist status
      operationId: getOnboardingProgress
      responses:
        "200":
          description: Onboarding progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgressResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/timezone-suggestion:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [organizations]
      summary: Suggest an IANA timezone from the organization's persisted address (ADR-071)
      description: >-
        A static country/state heuristic, not a real geocoding call. The owner must still actively confirm it via
        PATCH /organizations/{organizationId} — this endpoint never itself persists anything.
      operationId: getTimezoneSuggestion
      responses:
        "200":
          description: Timezone suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimezoneSuggestionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Payouts (Stripe Connect Express onboarding only — ADR-005, Phase 2 remainder) ---

  /organizations/{organizationId}/payout-account:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [payouts]
      summary: Get the organization's payout-account status
      description: Returns null if onboarding has never been started — a legitimate "not started" state, not an error.
      operationId: getPayoutAccountStatus
      responses:
        "200":
          description: Payout account status, or null if onboarding hasn't started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutAccountResponse"
                nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/payout-account/onboarding-link:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    post:
      tags: [payouts]
      summary: Start (or resume) Stripe Connect Express onboarding
      description: Owner-only. Creates the Stripe Express account on first call, reuses it after; always returns a fresh onboarding link.
      operationId: startPayoutOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartOnboardingRequest"
      responses:
        "200":
          description: Onboarding link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingLinkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the organization owner, or not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/payout-account/refresh:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    post:
      tags: [payouts]
      summary: Re-sync payout-account status from Stripe
      description: Called when the browser returns from Stripe's hosted onboarding flow.
      operationId: refreshPayoutAccountStatus
      responses:
        "200":
          description: Updated payout account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutAccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Onboarding hasn't been started for this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/payout-account/summary:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [payouts]
      summary: Get the organization's current payout ledger summary
      description: >
        Phase 5 slice 1 (ADR-017). netAvailableMinor can be negative — a refund
        that exceeds what's currently eligible is shown honestly, never hidden,
        and is deducted from the next transfer.
      operationId: getPayoutSummary
      responses:
        "200":
          description: Payout summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/payout-account/transfer:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    post:
      tags: [payouts]
      summary: Trigger a payout transfer
      description: >
        Manager-role (OWNER/ADMINISTRATOR) only. Manual-trigger-only this phase
        (ADR-017) — no scheduler exists yet. Transfers the currently-eligible net
        amount to the organization's connected Stripe account; a zero or negative
        net amount is a clean no-op, not an error.
      operationId: triggerPayoutTransfer
      responses:
        "200":
          description: Updated payout summary (after the transfer, if one occurred)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutSummaryResponse"
        "400":
          description: The connected account isn't yet enabled to receive payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Onboarding hasn't been started for this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/invitations:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [invitations]
      summary: List pending administrator invitations
      operationId: listInvitations
      parameters:
      - $ref: "#/components/parameters/PageParam"
      - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of pending invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [invitations]
      summary: Invite an adult administrator to the organization
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created. The response includes the raw token once — it is not retrievable afterward.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/invitations/{invitationId}:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags: [invitations]
      summary: Resend a pending invitation with a rotated accept token
      operationId: resendInvitation
      responses:
        "200":
          description: Invitation token rotated and re-queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

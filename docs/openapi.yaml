                $ref: "#/components/schemas/ProductPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [stores]
      summary: Create a product
      description: Created in DRAFT status, no design or variants yet.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/ProductIdParam"
    get:
      tags: [stores]
      summary: Get a product by ID
      operationId: getProduct
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/products/{productId}/status:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/ProductIdParam"
    patch:
      tags: [stores]
      summary: Update a product's status
      operationId: updateProductStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductStatusRequest"
      responses:
        "200":
          description: Product with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/products/{productId}/design:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/ProductIdParam"
    put:
      tags: [stores]
      summary: Assign an uploaded design image to a product
      description: >
        The asset must already be READY via the standard media upload flow
        (POST .../media/uploads + confirm, usageSlot=PRODUCT_DESIGN). One design
        slot per product this slice — no front/back split, no auto-design.
      operationId: assignProductDesign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignProductDesignRequest"
      responses:
        "200":
          description: Assigned design (signed read URL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/products/{productId}/variants:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/ProductIdParam"
    get:
      tags: [stores]
      summary: List a product's active variants
      operationId: listProductVariants
      responses:
        "200":
          description: Active variants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductVariantResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [stores]
      summary: Create a product variant (real Printify cost snapshot)
      description: >
        Calls Printify once for this specific chosen provider+variant (uploading
        the product's design to Printify's image library first, if not already
        done) to learn its real cost, which is snapshotted onto the variant —
        never guessed. No cross-provider price comparison happens here.
      operationId: createProductVariant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductVariantRequest"
      responses:
        "201":
          description: Variant created, with Printify's real cost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVariantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PrintifyUnavailable"

  /public/stores/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [stores]
      summary: Get a published store's public page by slug
      description: >
        Public, unauthenticated. Combines the store, its ACTIVE products, their
        active variants, and each product's public design URL into one response
        so the storefront doesn't need N+1 calls.
      operationId: getPublicStore
      responses:
        "200":
          description: Published store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStoreResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Orders and checkout (Phase 4 slice 1) ---

  /organizations/{organizationId}/stores/{storeId}/orders:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/StoreIdParam"
    get:
      tags: [orders]
      summary: List an organization's confirmed orders for a store
      operationId: listStoreOrders
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of confirmed orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/orders/{orderId}/fulfillment:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [orders]
      summary: Get an order's fulfillment status
      description: >
        Null until the order is confirmed. DRAFT_CREATED means a Printify order
        object exists but send_to_production.json was never called this slice —
        see ADR-016. FAILED means payment was confirmed but the Printify
        draft-order call itself failed; the order/payment record still stands.
      operationId: getOrderFulfillment
      responses:
        "200":
          description: Fulfillment status, or null if not yet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/orders/{orderId}/refund:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      summary: Refund a confirmed order
      description: >
        Manager-role (OWNER/ADMINISTRATOR) only, within 14 days of confirmation
        (ADR-017). Reverses the Stripe charge for the gross sale amount and
        records a REFUND ledger entry; Printify production cost already spent is
        not returned, and the platform fee is not returned either.
      operationId: refundOrder
      responses:
        "200":
          description: The refunded order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Not confirmed, no payment on record, or outside the 14-day refund window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/stores/{slug}/orders:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [orders]
      summary: Start a multi-item order checkout (test-mode Stripe Checkout)
      description: >
        Public, unauthenticated. No persisted cart — the browser holds line
        items locally and submits them all at once. Creates a PENDING order and
        a multi-line-item Stripe Checkout Session with US shipping-address
        collection; the caller redirects the browser to the returned
        checkoutUrl. Confirmation happens only via POST /webhooks/stripe.
      operationId: createOrderCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderCheckoutRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCheckoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The payments provider is unavailable (e.g. no Stripe test-mode key configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /public/stores/{slug}/orders/{orderId}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [orders]
      summary: Poll an order's status
      description: >
        Public, unauthenticated — used by the browser's Stripe Checkout return
        page. Read-only: reflects what the Stripe webhook has already recorded.
      operationId: getOrderStatus
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Sponsorships (Phase 6 slice 1, ADR-018) ---

  /organizations/{organizationId}/sponsorship-packages:
    parameters:

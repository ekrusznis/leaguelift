        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/sponsorships/{sponsorshipId}/approve:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/SponsorshipIdParam"
    post:
      tags: [sponsorships]
      summary: Approve a confirmed, pending-review sponsorship
      description: >
        Manager-role only. Only action that makes a sponsorship appear on the
        public sponsor directory (Phase 6 remainder approval workflow,
        ADR-019). Rejected (400) if the sponsorship isn't CONFIRMED or was
        already reviewed.
      operationId: approveSponsorship
      responses:
        "200":
          description: Approved sponsorship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/sponsorships/{sponsorshipId}/reject:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/SponsorshipIdParam"
    post:
      tags: [sponsorships]
      summary: Reject a confirmed, pending-review sponsorship (atomically refunds it)
      description: >
        Manager-role only. Rejection is never charged-but-hidden — this
        atomically (same transaction) issues the same Stripe refund + ledger
        reversal POST .../refund performs (Phase 6 remainder, ADR-019).
        Subject to the same 14-day refund window as a general refund.
        Rejected (400) if the sponsorship isn't CONFIRMED, was already
        reviewed, or falls outside the refund window.
      operationId: rejectSponsorship
      responses:
        "200":
          description: Rejected (and refunded) sponsorship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The payments provider is unavailable (e.g. no Stripe test-mode key configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/sponsorships/{sponsorshipId}/refund:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/SponsorshipIdParam"
    post:
      tags: [sponsorships]
      summary: Refund a confirmed sponsorship
      description: >
        Manager-role only. Independent of the review workflow — a
        sponsorship can be refunded whether or not it was ever approved.
        Within a 14-day window of confirmedAt, mirroring ADR-017's
        contribution/order refund exactly (Phase 6 remainder, ADR-019).
        Rejected (400) if the sponsorship isn't CONFIRMED or the window has
        elapsed.
      operationId: refundSponsorship
      responses:
        "200":
          description: Refunded sponsorship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The payments provider is unavailable (e.g. no Stripe test-mode key configured)

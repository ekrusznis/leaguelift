      type: string
      enum: [PENDING_REVIEW, APPROVED, REJECTED]
      description: >
        The org-admin approval gate (Phase 6 remainder, ADR-019) — kept
        conceptually separate from SponsorshipStatus (payment lifecycle): a
        sponsorship can be CONFIRMED and still PENDING_REVIEW, or CONFIRMED
        and REJECTED simultaneously with status=REFUNDED (rejecting
        atomically refunds).
    SponsorshipResponse:
      type: object
      required: [id, status, paymentSource, amountMinor, currency, sponsorId, sponsorName, reviewStatus, createdAt]
      description: >
        Org-admin list shape — sponsorships that were confirmed at some point
        (CONFIRMED or REFUNDED). Used by
        GET .../sponsorship-packages/{packageId}/sponsorships and
        GET .../sponsorships/pending-review (ADR-019).
      properties:
        id:
          type: string

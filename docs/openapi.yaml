      summary: Append and send a broadcast message to the thread's current audience
      description: Each send creates an immutable recipient snapshot. Athlete-targeted messages also create in-app-only guardian visibility copies for linked guardians.
      parameters:
        - {in: path, name: organizationId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: threadId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendBroadcastMessageRequest'}
      responses:
        '201':

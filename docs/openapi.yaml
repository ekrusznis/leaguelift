openapi: 3.0.3
info:
  title: LeagueLift API
  description: >
    LeagueLift revenue, fundraising, commerce, and fee-management API for youth sports
    organizations. This document currently covers the Phase 0 foundation plus the
    Phase 1 "organization onboarding" vertical slice (DESIGN-DOC.md sections 16.1 and
    35). Endpoints are added milestone by milestone, and this file is authoritative
    for the API contract — do not add backend endpoints without updating this
    document in the same change.
  version: "0.2.0"
servers:
  - url: /api/v1
tags:
  - name: system
  - name: identity
  - name: organizations
  - name: members
  - name: invitations
paths:
  /public/status:
    get:
      tags: [system]
      summary: Public liveness/status check
      operationId: getPublicStatus
      security: []
      responses:
        "200":
          description: Service is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /bootstrap:
    post:
      tags: [identity]
      summary: Provision the authenticated identity-provider subject as an internal app_user
      description: >
        Idempotent. If an app_user already exists for the caller's external subject,
        returns it unchanged; otherwise creates it.
      operationId: bootstrapCurrentUser
      responses:
        "200":
          description: Current user provisioned/retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [identity]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations:
    get:
      tags: [organizations]
      summary: List organizations the current user is a member of
      operationId: listOrganizations
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [organizations]
      summary: Create an organization
      description: The creator is granted the OWNER membership role.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [organizations]
      summary: Get an organization by ID
      operationId: getOrganization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [organizations]
      summary: Update an organization
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [members]
      summary: List members of an organization
      operationId: listOrganizationMembers
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [members]
      summary: Change a member's role
      description: >
        Owner-only role is out of scope here — ownership transfer is a separate
        controlled workflow (DESIGN-DOC.md section 7.2). Only OWNER or ADMINISTRATOR
        callers may change other members' roles.
      operationId: updateMembershipRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipRoleRequest"
      responses:
        "204":
          description: Role updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [members]
      summary: Revoke a member's access
      operationId: revokeMembership
      responses:
        "204":
          description: Membership revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/onboarding:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [organizations]
      summary: Get the organization's onboarding checklist status
      operationId: getOnboardingProgress
      responses:
        "200":
          description: Onboarding progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgressResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [invitations]
      summary: List pending administrator invitations
      operationId: listInvitations
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of pending invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [invitations]
      summary: Invite an adult administrator to the organization
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created. The response includes the raw token once —
            it is not retrievable afterward.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [invitations]
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      responses:
        "204":
          description: Invitation revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /invitations/{token}/accept:
    post:
      tags: [invitations]
      summary: Accept an invitation as the currently authenticated user
      description: >
        The invitation's email must match the caller's own account email. Not nested
        under /organizations/{organizationId} because the caller does not have
        membership in that organization yet.
      operationId: acceptInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted; membership granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Invitation email does not match the caller's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationIdParam:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not authorized for this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found (or not visible to the caller)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        version:
          type: string
          example: "0.1.0"
    ErrorResponse:
      type: object
      required: [code, message, requestId, fieldErrors]
      properties:
        code:
          type: string
          example: ORGANIZATION_NOT_FOUND
        message:
          type: string
          example: The organization could not be found.
        requestId:
          type: string
          example: req_01hz8x9y2z
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    UserResponse:
      type: object
      required: [id, email, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
    CreateOrganizationRequest:
      type: object
      required: [name, slug, organizationType]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
        sports:
          type: array
          items:
            type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          maxLength: 40
    OrganizationType:
      type: string
      enum:
        - RECREATIONAL_LEAGUE
        - TRAVEL_CLUB
        - INDIVIDUAL_TEAM
        - TOURNAMENT_OPERATOR
        - BOOSTER_ORGANIZATION
        - MULTISPORT_FACILITY
        - COMMUNITY_PROGRAM
        - OTHER
    OrganizationResponse:
      type: object
      required: [id, name, slug, organizationType, status, sports, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, ARCHIVED]
        sports:
          type: array
          items:
            type: string
        contactEmail:
          type: string
          format: email
          nullable: true
        contactPhone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    MembershipRole:
      type: string
      enum:
        - OWNER
        - ADMINISTRATOR
        - FINANCE_MANAGER
        - TEAM_ADMINISTRATOR
        - TOURNAMENT_ADMINISTRATOR
        - VIEWER
    MembershipResponse:
      type: object
      required: [id, organizationId, userId, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          type: string
          enum: [ACTIVE, INVITED, REVOKED]
        createdAt:
          type: string
          format: date-time
    MembershipPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MembershipResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    UpdateMembershipRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/MembershipRole"
    OnboardingProgressResponse:
      type: object
      required: [profileComplete, hasAdditionalAdministrator]
      properties:
        profileComplete:
          type: boolean
          description: Organization has at least one sport and a contact email set.
        hasAdditionalAdministrator:
          type: boolean
          description: The organization has more than just its original owner as a member.
    InvitableMembershipRole:
      type: string
      description: MembershipRole minus OWNER — ownership transfer is a separate workflow.
      enum:
        - ADMINISTRATOR
        - FINANCE_MANAGER
        - TEAM_ADMINISTRATOR
        - TOURNAMENT_ADMINISTRATOR
        - VIEWER
    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/InvitableMembershipRole"
    InvitationResponse:
      type: object
      required: [id, organizationId, email, role, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateInvitationResponse:
      type: object
      required: [invitation, token]
      properties:
        invitation:
          $ref: "#/components/schemas/InvitationResponse"
        token:
          type: string
          description: Raw invitation token, returned only once at creation time. Use it
            to build the accept link (e.g. app.leaguelift.com/invitations/{token}).
    InvitationPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvitationResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
security:
  - bearerAuth: []

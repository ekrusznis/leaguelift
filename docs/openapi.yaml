        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    UpdateMembershipRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/MembershipRole"
    OnboardingProgressResponse:
      type: object
      required: [profileComplete, hasAdditionalAdministrator, payoutsConnected, timezoneConfirmed]
      properties:
        profileComplete:
          type: boolean
          description: Organization has at least one sport and a contact email set.
        hasAdditionalAdministrator:
          type: boolean
          description: The organization has more than just its original owner as a member.
        payoutsConnected:
          type: boolean
          description: Stripe Connect Express onboarding is complete (chargesEnabled and payoutsEnabled both true — ADR-005).
        timezoneConfirmed:
          type: boolean
          description: Organization has a non-null timezone — a non-null value IS the owner's confirmation signal (ADR-071).
    TimezoneSuggestionResponse:
      type: object
      required: [timezone]
      properties:
        timezone:
          type: string
          nullable: true
          description: >-

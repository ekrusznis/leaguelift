              $ref: "#/components/schemas/UpdateSponsorshipPackageRequest"
      responses:
        "200":
          description: Updated sponsorship package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipPackageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/sponsorship-packages/{packageId}/publish:
    parameters:

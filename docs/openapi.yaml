      responses:
        "200":
          description: Sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [sponsorships]
      summary: Update a sponsor's CRM details
      description: >
        Sponsor-contact CRM update (Phase 6 remainder, ADR-019) — widens
        sponsor beyond name/contact-email with phone/company name/notes.
        Manager-role only.
      operationId: updateSponsor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSponsorRequest"
      responses:
        "200":
          description: Updated sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/sponsorship-packages/qr-code:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [sponsorships]
      summary: Generate a shareable QR code for a URL
      description: >
        Stateless (Phase 6 remainder, ADR-019) — no persistence, no
        click-through tracking. The frontend supplies the org's own public
        sponsorship-page URL (${origin}/sponsors/${organizationSlug}); this
        endpoint just encodes it as a QR code image. Any active org member.
      operationId: getSponsorshipShareLinkQrCode
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            maxLength: 2000
      responses:
        "200":
          description: Share link + QR code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/sponsorships/pending-review:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [sponsorships]
      summary: List confirmed sponsorships awaiting org-admin review
      description: The approval queue (Phase 6 remainder, ADR-019) — across all of the organization's packages, oldest-confirmed-first. Any active org member.
      operationId: listPendingReviewSponsorships
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of confirmed, still-pending-review sponsorships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/sponsorships/{sponsorshipId}/approve:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/SponsorshipIdParam"
    post:
      tags: [sponsorships]
      summary: Approve a confirmed, pending-review sponsorship
      description: >
        Manager-role only. Only action that makes a sponsorship appear on the
        public sponsor directory (Phase 6 remainder approval workflow,
        ADR-019). Rejected (400) if the sponsorship isn't CONFIRMED or was
        already reviewed.
      operationId: approveSponsorship
      responses:
        "200":
          description: Approved sponsorship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/sponsorships/{sponsorshipId}/reject:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/SponsorshipIdParam"
    post:
      tags: [sponsorships]
      summary: Reject a confirmed, pending-review sponsorship (atomically refunds it)
      description: >
        Manager-role only. Rejection is never charged-but-hidden — this
        atomically (same transaction) issues the same Stripe refund + ledger
        reversal POST .../refund performs (Phase 6 remainder, ADR-019).
        Subject to the same 14-day refund window as a general refund.
        Rejected (400) if the sponsorship isn't CONFIRMED, was already
        reviewed, or falls outside the refund window.
      operationId: rejectSponsorship
      responses:
        "200":
          description: Rejected (and refunded) sponsorship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The payments provider is unavailable (e.g. no Stripe test-mode key configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/sponsorships/{sponsorshipId}/refund:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/SponsorshipIdParam"
    post:
      tags: [sponsorships]
      summary: Refund a confirmed sponsorship
      description: >
        Manager-role only. Independent of the review workflow — a
        sponsorship can be refunded whether or not it was ever approved.
        Within a 14-day window of confirmedAt, mirroring ADR-017's
        contribution/order refund exactly (Phase 6 remainder, ADR-019).
        Rejected (400) if the sponsorship isn't CONFIRMED or the window has
        elapsed.
      operationId: refundSponsorship
      responses:
        "200":
          description: Refunded sponsorship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The payments provider is unavailable (e.g. no Stripe test-mode key configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/sponsorships/{sponsorshipId}/invoice:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/SponsorshipIdParam"
    get:
      tags: [sponsorships]
      summary: Get a receipt-style invoice for a confirmed sponsorship
      description: >
        Computed on read, not a stored/numbered invoice document (Phase 6
        remainder, ADR-019). Available for any sponsorship that reached
        CONFIRMED (including one since REFUNDED). Any active org member.
      operationId: getSponsorshipInvoice
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipInvoiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/organizations/{slug}/sponsorship-packages:
    get:
      tags: [sponsorships]
      summary: List an organization's published sponsorship packages by org slug
      operationId: listPublicSponsorshipPackages
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published sponsorship packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicSponsorshipPackageResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/organizations/{slug}/sponsors:
    get:
      tags: [sponsorships]
      summary: Public sponsor directory — confirmed AND org-admin-approved sponsors and their logos for an organization
      description: >
        Only sponsorships that are both status=CONFIRMED and
        reviewStatus=APPROVED appear here (Phase 6 remainder approval
        workflow, ADR-019) — a newly confirmed sponsorship stays off this
        list until an org admin approves it via
        POST .../sponsorships/{sponsorshipId}/approve.
      operationId: listPublicSponsorDirectory
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmed sponsors (logoUrl is null until an org admin assigns one)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SponsorDirectoryEntryResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/sponsorship-packages/{packageId}/sponsorships:
    parameters:
      - $ref: "#/components/parameters/SponsorshipPackageIdParam"
    post:
      tags: [sponsorships]
      summary: Start a sponsorship purchase checkout (test-mode Stripe Checkout)
      description: >
        Public, unauthenticated. Creates a sponsor record, a PENDING
        sponsorship, and a Stripe Checkout Session; the caller redirects the
        browser to the returned checkoutUrl. Confirmation happens only via
        POST /webhooks/stripe, not this response — see SponsorshipService.
        Rejected (400) if the package isn't PUBLISHED or is sold out
        (confirmedCount >= effective max quantity).
      operationId: createSponsorshipCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSponsorshipCheckoutRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipCheckoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The payments provider is unavailable (e.g. no Stripe test-mode key configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /public/sponsorship-packages/{packageId}/sponsorships/{sponsorshipId}:
    parameters:
      - $ref: "#/components/parameters/SponsorshipPackageIdParam"
      - $ref: "#/components/parameters/SponsorshipIdParam"
    get:
      tags: [sponsorships]
      summary: Poll a sponsorship's status
      description: >
        Public, unauthenticated — used by the browser's Stripe Checkout return
        page. Read-only: this never flips status itself, it only reflects what
        the Stripe webhook has already recorded.
      operationId: getSponsorshipStatus
      responses:
        "200":
          description: Sponsorship status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/dashboard-context:
    get:
      tags: [dashboard]
      summary: >
        Resolve which dashboard the signed-in user should land on (real role check —
        DESIGN-DOC.md section 10.1 — not a dev-only switcher). See
        DashboardContextService for the resolution order and its interim limitations.
      operationId: getDashboardContext
      responses:
        "200":
          description: Resolved dashboard context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardContextResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"


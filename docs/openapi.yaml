      description: >
        Public, unauthenticated — a sponsor purchasing a package is never a
        Rally26 user. Confirmation happens only via the Stripe webhook
        (POST /webhooks/stripe), not this call's response. No logo upload here —
        see AssignSponsorLogoRequest; an org admin assigns the sponsor's logo
        after the sponsorship confirms (ADR-018).

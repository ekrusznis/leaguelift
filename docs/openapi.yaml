    post:
      tags: [messaging]
      summary: Create a team-scoped two-way coach-to-family conversation and send its first message
      description: Selected guardians and activated athletes become reply-capable members. Linked guardians of selected athletes are added automatically with in-app read-only visibility unless explicitly selected too.
      parameters:
        - {in: path, name: organizationId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConversationRequest'}
      responses:
        '201':
          description: Conversation created or safely reused by idempotency key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageThreadResponse'}

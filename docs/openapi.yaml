          $ref: "#/components/responses/NotFound"

  /public/sponsorship-packages/{packageId}/sponsorships:
    parameters:
    - $ref: "#/components/parameters/SponsorshipPackageIdParam"
    post:
      tags: [sponsorships]
      summary: Start a sponsorship purchase checkout (test-mode Stripe Checkout)
      description: >
        Public, unauthenticated. Creates a sponsor record, a PENDING
        sponsorship, and a Stripe Checkout Session; the caller redirects the
        browser to the returned checkoutUrl. Confirmation happens only via
        POST /webhooks/stripe, not this response — see SponsorshipService.
        Rejected (400) if the package isn't PUBLISHED or is sold out
        (confirmedCount >= effective max quantity).
      operationId: createSponsorshipCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSponsorshipCheckoutRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipCheckoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The payments provider is unavailable (e.g. no Stripe test-mode key configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


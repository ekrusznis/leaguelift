      operationId: startOrganizationIntegrationAuthorization
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - name: provider
        in: path
        required: true
        schema: {$ref: "#/components/schemas/IntegrationProvider"}
      responses:
        "200": {description: Authorization started, content: {application/json: {schema: {$ref: "#/components/schemas/AuthorizationStartResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /me/integrations/{provider}/oauth/start:
    post:
      tags: [integrations]
      summary: Start a personal OAuth authorization
      operationId: startPersonalIntegrationAuthorization
      parameters:
      - name: provider
        in: path
        required: true
        schema: {$ref: "#/components/schemas/IntegrationProvider"}
      responses:
        "200": {description: Authorization started, content: {application/json: {schema: {$ref: "#/components/schemas/AuthorizationStartResponse"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}

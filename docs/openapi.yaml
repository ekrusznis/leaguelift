          format: uuid
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateInvitationResponse:

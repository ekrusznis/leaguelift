    get:
      tags: [sponsorships]
      summary: List confirmed sponsorships awaiting org-admin review
      description: The approval queue (Phase 6 remainder, ADR-019) — across all of the organization's packages, oldest-confirmed-first. Any
        active org member.
      operationId: listPendingReviewSponsorships
      parameters:
      - $ref: "#/components/parameters/PageParam"
      - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":

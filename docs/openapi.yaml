    PayoutSummaryResponse:
      type: object
      required: [eligibleMinor, heldMinor, pendingDebitsMinor, netAvailableMinor]
      description: Phase 5 slice 1 (ADR-017) ledger summary backing PayoutSummaryPanel.
      properties:
        eligibleMinor:
          type: integer
          format: int64
          description: ORGANIZATION_EARNING credits past the holding period, not yet transferred.
        heldMinor:
          type: integer
          format: int64
          description: ORGANIZATION_EARNING credits still within the holding period.
        pendingDebitsMinor:
          type: integer
          format: int64
          description: Reversal debits (refunds, below-cost orders) not yet netted against a transfer — counted immediately, no holding
            period.
        netAvailableMinor:
          type: integer
          format: int64
          description: eligibleMinor minus pendingDebitsMinor. Can be negative.


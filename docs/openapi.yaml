      enum: [STRIPE, OFFLINE]
      description: Whether Rally26 processed the payment through Stripe or only recorded money received outside Rally26.
    CreateContributionCheckoutRequest:
      type: object
      required: [amountMinor, successUrl, cancelUrl]
      description: >
        Public, unauthenticated — a supporter contributing to a campaign is never a
        Rally26 user. Confirmation happens only via the Stripe webhook
        (POST /webhooks/stripe), not this call's response.
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Contribution amount in minor currency units. Bounded server-side (ContributionLimits — currently $1.00-$50,000.00).
        supporterName:
          type: string
          maxLength: 120
          nullable: true
        isAnonymous:
          type: boolean
          default: false
          description: When true, supporterName is dropped server-side regardless of what was sent.
        supporterEmail:
          type: string
          format: email
          maxLength: 254
          nullable: true
        successUrl:
          type: string
          description: >
            May contain the literal placeholder "{CONTRIBUTION_ID}", substituted
            server-side with the created contribution's id before being handed to
            Stripe as the Checkout Session's success_url (mirrors Stripe's own
            "{CHECKOUT_SESSION_ID}" convention) — the frontend can't know the
            contribution id until this call returns.
        cancelUrl:
          type: string
    ContributionCheckoutResponse:
      type: object
      required: [contributionId, checkoutUrl]
      properties:
        contributionId:
          type: string
          format: uuid
        checkoutUrl:
          type: string
          description: Stripe-hosted Checkout Session URL. Redirect the browser here directly.
    ContributionStatusResponse:
      type: object
      required: [id, status, amountMinor, currency]

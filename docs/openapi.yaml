      description: Any signed-in user, no organization-membership gate — a pure guardian or coach relationship (no
        organization_membership row) must be able to browse this, and the same data is already public via
        GET /public/stores/{slug}.
      operationId: listSwagShopApparelTypes
      responses:
        "200":
          description: One row per active apparel type, combining store/product/variant data
          content:

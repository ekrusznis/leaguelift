  /organizations/{organizationId}/season-rollovers/preview:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    post:
      tags: [season-rollovers]
      summary: Preview a team season rollover
      description: >
        Owner/administrator only. Produces an exact, side-effect-free preview and SHA-256
        confirmation hash for a new team identity plus any selected active roster links,
        explicit TEAM role assignments, and ready logo/cover assignments. Financial,
        event/RSVP, identity, guardian, invitation, and consent state is never copied.
      operationId: previewSeasonRollover
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonRolloverPreviewRequest"
      responses:
        "200":
          description: Exact side-effect-free rollover preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonRolloverPreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Destination team name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/season-rollovers/execute:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    post:
      tags: [season-rollovers]
      summary: Execute a confirmed team season rollover
      description: >
        Recomputes the complete selected snapshot under repeatable-read isolation and
        requires the exact confirmation hash returned by preview. Creates one active
        destination team, optionally copies only the three selected safe setup categories,
        optionally archives the source team, records an immutable run, and is idempotent
        for retries with the same confirmation hash.
      operationId: executeSeasonRollover
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonRolloverExecuteRequest"
      responses:
        "200":
          description: Completed or previously completed rollover
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonRolloverResultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Preview is stale, selected data changed, or destination name is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


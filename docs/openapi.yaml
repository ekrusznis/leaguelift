        "200":
          description: Paginated list of confirmed sponsorships, each with its sponsor's name/contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/sponsors/{sponsorId}/logo:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/SponsorIdParam"
    put:
      tags: [sponsorships]
      summary: Assign an uploaded logo image to a sponsor
      description: >
        The asset must already be READY via the standard media upload flow
        (POST .../media/uploads + confirm, usageSlot=SPONSOR_LOGO). Manager-role
        only — an org admin performs this after a sponsorship confirms; there is
        no public/self-service logo upload during checkout (ADR-018).
      operationId: assignSponsorLogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSponsorLogoRequest"
      responses:
        "200":
          description: Assigned logo (signed read URL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/sponsors/{sponsorId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/SponsorIdParam"
    get:
      tags: [sponsorships]

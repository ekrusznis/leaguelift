components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationIdParam:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamIdParam:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TournamentIdParam:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageIdParam:
      name: pageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HouseholdIdParam:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParticipantIdParam:
      name: participantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeeTemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeeAssignmentIdParam:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentIdParam:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdjustmentIdParam:
      name: adjustmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignIdParam:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetIdParam:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UsageSlotParam:
      name: usageSlot
      in: path
      required: true
      schema:
        type: string
        enum: [LOGO, COVER]
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not authorized for this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found (or not visible to the caller)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        version:
          type: string
          example: "0.1.0"
    ErrorResponse:
      type: object
      required: [code, message, requestId, fieldErrors]
      properties:
        code:
          type: string
          example: ORGANIZATION_NOT_FOUND
        message:
          type: string
          example: The organization could not be found.
        requestId:
          type: string
          example: req_01hz8x9y2z
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 200
        firstName:
          type: string
          maxLength: 60
        lastName:
          type: string
          maxLength: 60
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        user:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      required: [id, email, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
    CreateOrganizationRequest:
      type: object
      required: [name, slug, organizationType]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
        sports:
          type: array
          items:
            type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          maxLength: 40
    OrganizationType:
      type: string
      enum:
        - RECREATIONAL_LEAGUE
        - TRAVEL_CLUB
        - INDIVIDUAL_TEAM
        - TOURNAMENT_OPERATOR
        - BOOSTER_ORGANIZATION
        - MULTISPORT_FACILITY
        - COMMUNITY_PROGRAM
        - OTHER
    OrganizationResponse:
      type: object
      required: [id, name, slug, organizationType, status, sports, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, ARCHIVED]
        sports:
          type: array
          items:
            type: string
        contactEmail:
          type: string
          format: email
          nullable: true
        contactPhone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    MembershipRole:
      type: string
      enum:
        - OWNER
        - ADMINISTRATOR
        - FINANCE_MANAGER
        - TEAM_ADMINISTRATOR
        - TOURNAMENT_ADMINISTRATOR
        - VIEWER
    MembershipResponse:
      type: object
      required: [id, organizationId, userId, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          type: string
          enum: [ACTIVE, INVITED, REVOKED]
        createdAt:
          type: string
          format: date-time
    MembershipPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MembershipResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    UpdateMembershipRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/MembershipRole"
    OnboardingProgressResponse:
      type: object
      required: [profileComplete, hasAdditionalAdministrator, payoutsConnected]
      properties:
        profileComplete:
          type: boolean
          description: Organization has at least one sport and a contact email set.
        hasAdditionalAdministrator:
          type: boolean
          description: The organization has more than just its original owner as a member.
        payoutsConnected:
          type: boolean
          description: Stripe Connect Express onboarding is complete (chargesEnabled and payoutsEnabled both true — ADR-005).
    InvitableMembershipRole:
      type: string
      description: MembershipRole minus OWNER — ownership transfer is a separate workflow.
      enum:
        - ADMINISTRATOR
        - FINANCE_MANAGER
        - TEAM_ADMINISTRATOR
        - TOURNAMENT_ADMINISTRATOR
        - VIEWER
    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email

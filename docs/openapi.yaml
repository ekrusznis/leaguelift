    get:
      tags: [integrations]
      summary: Consume a provider OAuth callback
      description: Public redirect endpoint secured by hashed, expiring, single-use state and PKCE. No provider token is returned.
      operationId: completeIntegrationAuthorization
      security: []
      parameters:
      - name: provider
        in: path
        required: true
        schema: {$ref: "#/components/schemas/IntegrationProvider"}
      - name: code
        in: query
        schema: {type: string}
      - name: state
        in: query
        schema: {type: string}
      - name: error
        in: query
        schema: {type: string}
      responses:
        '302':
          description: Redirect to the frontend My Integrations page with a sanitized result marker.

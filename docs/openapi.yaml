    - name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags: [orders]
      summary: Get an order's fulfillment operations record
      description: Null until payment confirmation. The source is explicitly PRINTIFY or MANUAL; manual records never contain invented
        provider IDs.
      operationId: getOrderFulfillment
      responses:
        "200":
          description: Fulfillment record, or null if not yet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentResponse"

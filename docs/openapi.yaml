      type: object
      properties:
        url:
          type: string
          nullable: true
          description: Null when the event has no address and no coordinates.
    ConnectIcsFeedRequest:
      type: object
      required: [label, feedUrl, timezone]
      properties:
        label:
          type: string
          example: Varsity Soccer Schedule
        feedUrl:
          type: string
          format: uri
          example: https://example.com/schedule.ics
        timezone:
          type: string
          description: Resolves the feed's floating (no UTC offset) DTSTART/DTEND values (Phase 12 slice 3, ADR-033).
          example: America/New_York
        teamId:
          type: string
          format: uuid
          nullable: true
          description: Null for an org-wide feed — mirrors CSV import's own per-upload team scope (ADR-032).
    EventSourceConnectionResponse:
      type: object
      required: [id, provider, label, timezone, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [ICS_FEED, MAXPREPS, GAMECHANGER]
        label:
          type: string
        feedUrl:
          type: string
          nullable: true
        timezone:
          type: string
        teamId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISCONNECTED]
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: Null until the connection's first scheduled sync runs (Phase 12 slice 3).
        lastSyncStatus:
          type: string
          enum: [SUCCESS, FAILED]
          nullable: true
        lastSyncError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    CsvImportRequest:
      type: object
      required: [timezone, csvContent]
      properties:
        teamId:
          type: string
          format: uuid
          nullable: true
          description: Null for an org-wide import.
        timezone:
          type: string
          example: America/New_York
        csvContent:
          type: string
          description: The raw CSV file content (read client-side via FileReader, sent as a plain string — no multipart upload in this codebase).
    CsvImportRowErrorResponse:
      type: object
      required: [rowNumber, message]
      properties:
        rowNumber:
          type: integer
          description: 1-indexed, counting the header row as row 1.
        message:
          type: string
    CsvImportResponse:
      type: object
      required: [createdCount, updatedCount, unchangedCount, errors]
      properties:
        createdCount:
          type: integer
        updatedCount:
          type: integer
        unchangedCount:
          type: integer
          description: Rows whose external_id matched an existing event with an identical content hash — a safe no-op re-upload.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/CsvImportRowErrorResponse"

        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of stores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [stores]
      summary: Create a store
      description: Created in DRAFT status. Not publicly visible (via GET /public/stores/{slug}) until ACTIVE.
      operationId: createStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreRequest"
      responses:
        "201":
          description: Store created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The requested slug is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/stores/{storeId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/StoreIdParam"
    get:
      tags: [stores]
      summary: Get a store by ID
      operationId: getStore
      responses:
        "200":
          description: Store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/stores/{storeId}/status:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/StoreIdParam"
    patch:
      tags: [stores]
      summary: Update a store's status
      operationId: updateStoreStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreStatusRequest"
      responses:
        "200":
          description: Store with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/stores/{storeId}/products:

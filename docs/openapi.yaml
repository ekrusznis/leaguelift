      summary: Get a sponsor's CRM details
      description: Sponsor-contact CRM read (Phase 6 remainder, ADR-019). Any active org member.
      operationId: getSponsor
      responses:
        "200":
          description: Sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [sponsorships]
      summary: Update a sponsor's CRM details
      description: >
        Sponsor-contact CRM update (Phase 6 remainder, ADR-019) — widens
        sponsor beyond name/contact-email with phone/company name/notes.
        Manager-role only.
      operationId: updateSponsor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSponsorRequest"
      responses:
        "200":
          description: Updated sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/sponsorship-packages/qr-code:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [sponsorships]
      summary: Generate a shareable QR code for a URL
      description: >
        Stateless (Phase 6 remainder, ADR-019) — no persistence, no
        click-through tracking. The frontend supplies the org's own public
        sponsorship-page URL (${origin}/sponsors/${organizationSlug}); this
        endpoint just encodes it as a QR code image. Any active org member.
      operationId: getSponsorshipShareLinkQrCode
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          maxLength: 2000
      responses:
        "200":
          description: Share link + QR code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


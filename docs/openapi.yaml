        type: string
        format: uuid
    - name: reprintId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      tags: [orders]
      summary: Update replacement or reprint fulfillment
      operationId: updateFulfillmentReprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFulfillmentReprintRequest"
      responses:
        "200":
          description: Reprint updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentReprintResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/orders/{orderId}/refund:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags: [orders]
      summary: Refund a confirmed order
      description: >
        Manager-role (OWNER/ADMINISTRATOR) only, within 14 days of confirmation
        (ADR-017). Reverses the Stripe charge for the gross sale amount and
        records a REFUND ledger entry; Printify production cost already spent is
        not returned, and the platform fee is not returned either.
      operationId: refundOrder
      responses:
        "200":
          description: The refunded order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Not confirmed, no payment on record, or outside the 14-day refund window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/stores/{slug}/orders:
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
    post:
      tags: [orders]
      summary: Start a multi-item order checkout (test-mode Stripe Checkout)
      description: >
        Public, unauthenticated. No persisted cart — the browser holds line
        items locally and submits them all at once. Creates a PENDING order and
        a multi-line-item Stripe Checkout Session with US shipping-address
        collection; the caller redirects the browser to the returned
        checkoutUrl. Confirmation happens only via POST /webhooks/stripe.
      operationId: createOrderCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderCheckoutRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCheckoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The payments provider is unavailable (e.g. no Stripe test-mode key configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /public/stores/{slug}/orders/{orderId}:
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
    - name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags: [orders]
      summary: Poll an order's status
      description: >
        Public, unauthenticated — used by the browser's Stripe Checkout return
        page. Read-only: reflects what the Stripe webhook has already recorded.
      operationId: getOrderStatus
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Public Athlete Storefronts (Phase 24 slice 24.3, ADR-069) ---

  /organizations/{organizationId}/athlete-storefronts:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [athlete-storefronts]
      summary: List an organization's per-athlete storefronts
      operationId: listAthleteStorefronts
      parameters:
      - $ref: "#/components/parameters/PageParam"
      - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of athlete storefronts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteStorefrontPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [athlete-storefronts]
      summary: Create a per-athlete storefront
      description: >
        Team-scoped coach (TEAM_STORE_MANAGE) when teamId is given, otherwise
        org manager (OWNER/ADMINISTRATOR). The participant must be on the
        given team's active roster when teamId is specified, the store must
        be ACTIVE, and every selected product must belong to that store and
        be ACTIVE. Created in DRAFT status — not publicly visible (via GET
        /public/athlete-storefronts/{slug}) until published.
      operationId: createAthleteStorefront
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAthleteStorefrontRequest"
      responses:
        "201":
          description: Athlete storefront created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteStorefrontResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The requested slug is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/athlete-storefronts/share-link-qr:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    post:
      tags: [athlete-storefronts]
      summary: Generate a shareable QR code for a storefront's public URL
      description: >
        Stateless — no persistence, no click-through tracking. The frontend
        supplies its own public storefront page URL
        (${origin}/swag-shop/athlete/${slug}); this endpoint just encodes it
        as a QR code image. Any active org member.
      operationId: buildAthleteStorefrontShareLinkQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildAthleteStorefrontShareLinkRequest"
      responses:
        "200":
          description: QR code encoding the given URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkQrResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/athlete-storefronts/{storefrontId}:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/AthleteStorefrontIdParam"
    get:
      tags: [athlete-storefronts]
      summary: Get an athlete storefront by ID
      operationId: getAthleteStorefront
      responses:
        "200":
          description: Athlete storefront
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteStorefrontResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/athlete-storefronts/{storefrontId}/products:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/AthleteStorefrontIdParam"
    get:
      tags: [athlete-storefronts]
      summary: List the product IDs approved for a storefront
      operationId: listAthleteStorefrontProductIds
      responses:
        "200":
          description: Approved product IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [athlete-storefronts]
      summary: Replace a storefront's approved product selection
      operationId: updateAthleteStorefrontProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAthleteStorefrontProductsRequest"
      responses:
        "200":
          description: Athlete storefront with the updated product selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteStorefrontResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/athlete-storefronts/{storefrontId}/publish:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/AthleteStorefrontIdParam"
    patch:
      tags: [athlete-storefronts]
      summary: Publish an athlete storefront
      description: Transitions a DRAFT storefront to PUBLISHED and makes it visible via GET /public/athlete-storefronts/{slug}. Rejected
        (400) if the storefront is ARCHIVED or has no approved products selected. A no-op (200) if already PUBLISHED.
      operationId: publishAthleteStorefront
      responses:
        "200":
          description: Published athlete storefront
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteStorefrontResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/athlete-storefronts/{storefrontId}/unpublish:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/AthleteStorefrontIdParam"
    patch:
      tags: [athlete-storefronts]
      summary: Unpublish an athlete storefront back to DRAFT
      description: Rejected (400) if the storefront is ARCHIVED. A no-op (200) if already DRAFT.
      operationId: unpublishAthleteStorefront
      responses:
        "200":
          description: Unpublished (DRAFT) athlete storefront
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteStorefrontResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/athlete-storefronts/{storefrontId}/archive:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/AthleteStorefrontIdParam"
    patch:
      tags: [athlete-storefronts]
      summary: Archive an athlete storefront
      description: Terminal status. A no-op (200) if already ARCHIVED.
      operationId: archiveAthleteStorefront
      responses:
        "200":
          description: Archived athlete storefront
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteStorefrontResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/athlete-storefronts/{slug}:
    get:
      tags: [athlete-storefronts]
      summary: Get a published athlete storefront's public page by slug
      description: >
        Public, unauthenticated. Never distinguishes "doesn't exist" from
        "not published" (both 404), matching GET /public/stores/{slug}.
        Combines org/team names, the athlete's public-safe label
        ("Maya J." — first name plus last initial only, computed
        server-side; the real last name is never serialized) and the
        storefront's approved, still-ACTIVE products/variants into one
        response.
      operationId: getPublicAthleteStorefront
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Published athlete storefront
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteStorefrontPublicResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/athlete-storefronts/{slug}/orders:
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
    post:
      tags: [athlete-storefronts]
      summary: Start Stripe Checkout for a public athlete-storefront order
      description: >
        Public, unauthenticated — a supporter buying for a specific athlete
        is never a Rally26 user. Single item only, same optional
        personalization shape as POST
        /organizations/{organizationId}/swag-shop/orders — no
        successUrl/cancelUrl from the caller (fixed to this storefront's own
        page). On confirmation the order is attributed directly to the
        athlete's household (participantId -> household.id, no attribution
        code) and grants a family credit.
      operationId: createAthleteStorefrontOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAthleteStorefrontOrderRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCheckoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The payments provider is unavailable (e.g. no Stripe test-mode key configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /public/athlete-storefronts/{slug}/orders/{orderId}:
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
    - name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags: [athlete-storefronts]
      summary: Poll an athlete-storefront order's status
      description: >
        Public, unauthenticated — used by the browser's Stripe Checkout
        return page. Read-only: reflects what the Stripe webhook has already
        recorded.
      operationId: getAthleteStorefrontOrderStatus
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"


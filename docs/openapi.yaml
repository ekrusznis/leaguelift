          $ref: "#/components/schemas/NextEventSummary"
          nullable: true

    # --- Media ---
    RequestUploadRequest:
      type: object
      required: [usageSlot, fileName, contentType, fileSizeBytes]
      properties:
        usageSlot:
          type: string
          enum: [LOGO, COVER]
        fileName:
          type: string
        contentType:
          type: string
          example: image/png
        fileSizeBytes:
          type: integer
          format: int64
    RequestUploadResponse:
      type: object
      required: [assetId, uploadUrl, uploadMethod, requiredHeaders, expiresAt]
      properties:
        assetId:
          type: string
          format: uuid
        uploadUrl:
          type: string
        uploadMethod:
          type: string
          example: PUT
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    ConfirmUploadResponse:
      type: object
      required: [assetId, status]
      properties:
        assetId:
          type: string
          format: uuid
        status:
          type: string
          enum: [READY, REJECTED]
        contentType:
          type: string
          nullable: true
        byteSize:
          type: integer
          format: int64
          nullable: true
        widthPx:
          type: integer
          nullable: true
        heightPx:
          type: integer
          nullable: true
        rejectionReason:
          type: string
          nullable: true
    AssignMediaRequest:
      type: object
      required: [assetId]
      properties:
        assetId:
          type: string
          format: uuid
        altText:
          type: string
          nullable: true
    MediaAssignmentResponse:
      type: object
      required:
        [usageSlot, assetId, url, visibility, publicationStatus, updatedAt]
      properties:
        usageSlot:
          type: string
          enum: [LOGO, COVER]
        assetId:
          type: string
          format: uuid
        url:
          type: string
        altText:
          type: string
          nullable: true
        contentType:
          type: string
          nullable: true
        widthPx:
          type: integer
          nullable: true
        heightPx:
          type: integer
          nullable: true
        byteSizeBytes:
          type: integer
          format: int64
          nullable: true
        visibility:
          type: string
          enum:
            [
              PUBLIC,
              AUTHENTICATED,
              ORGANIZATION_PRIVATE,
              TEAM_PRIVATE,
              HOUSEHOLD_PRIVATE,
              SELF_PRIVATE,
              PLATFORM_PRIVATE,
            ]
        publicationStatus:
          type: string
          enum: [PRIVATE, APPROVED, PUBLISHED, RETIRED]
        updatedAt:
          type: string
          format: date-time
    MediaAssignmentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaAssignmentResponse"

    # --- Payouts ---
    StartOnboardingRequest:
      type: object
      required: [refreshUrl, returnUrl]
      properties:
        refreshUrl:
          type: string
          description: Where Stripe sends the browser back to if the onboarding link expires mid-flow.
        returnUrl:
          type: string
          description: Where Stripe sends the browser back to after the hosted onboarding flow completes.
    OnboardingLinkResponse:
      type: object
      required: [onboardingUrl]
      properties:
        onboardingUrl:
          type: string
    PayoutAccountResponse:
      type: object
      required: [stripeAccountId, detailsSubmitted, chargesEnabled, payoutsEnabled, isFullyConnected, updatedAt]
      properties:
        stripeAccountId:
          type: string
        detailsSubmitted:
          type: boolean
        chargesEnabled:
          type: boolean
        payoutsEnabled:
          type: boolean
        isFullyConnected:
          type: boolean
          description: chargesEnabled and payoutsEnabled both true.
        updatedAt:
          type: string
          format: date-time

security:
  - bearerAuth: []

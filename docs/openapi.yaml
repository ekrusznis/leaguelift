        if this call fails, never the sole source of truth.
      operationId: getEventTimezoneDefault
      parameters:
      - name: organizationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: teamId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: tournamentId
        in: query
        required: false
        schema: {type: string, format: uuid}
      responses:
        "200":
          description: Resolved default timezone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimezoneDefaultResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/events/csv-import:
    post:
      tags: [events]
      summary: Bulk-import events from a CSV file, scoped to one team (or org-wide) and one shared timezone (Phase 12 slice 2, ADR-032;
        requires event.create at the relevant scope) — imported events start TENTATIVE, not DRAFT
      operationId: importEventsCsv
      parameters:
      - name: organizationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvImportRequest"
      responses:
        "200":
          description: Import summary — row-level failures are collected here, not thrown, so a partially-bad file still processes its valid
            rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/events/{eventId}:
    get:
      tags: [events]
      summary: Get one event (staff requires event.read at the event's scope; a linked guardian or athlete may read a published team event
        on their authorized schedule)
      operationId: getEvent
      parameters:
      - name: organizationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: eventId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [events]
      summary: Update an event (Phase 10 slice 1, ADR-026; requires event.update at the event's scope) — team/tournament ownership is not
        reassignable via this endpoint; on an imported event (sourceType != MANUAL), setting a source-owned field (opponent/start/end
        time/venue/status) is rejected — detach-from-source first (Phase 12 slice 4, ADR-034)
      operationId: updateEvent
      parameters:
      - name: organizationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: eventId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/events/{eventId}/publish:
    post:
      tags: [events]
      summary: Publish a DRAFT event, moving it to TENTATIVE (Phase 10 slice 1, ADR-026; requires event.publish at the event's scope)
      operationId: publishEvent
      parameters:
      - name: organizationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: eventId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        "200":
          description: Published event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/events/{eventId}/cancel:

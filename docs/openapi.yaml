          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [fees]
      summary: Record a manual/offline payment against a fee assignment
      description: Cash/check/Venmo/etc. — independent of live Stripe charges (Phase 5). Auto-recomputes balance and status.
      operationId: recordFeePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPaymentRequest"
      responses:
        "201":

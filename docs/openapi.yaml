          description: Managed message threads
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageThreadPageResponse'}
    post:
      tags: [messaging]
      summary: Create a one-way organization or team broadcast thread
      parameters:
        - {in: path, name: organizationId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMessageThreadRequest'}
      responses:
        '201':
          description: Broadcast thread created or safely reused by idempotency key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageThreadResponse'}

      parameters:
      - $ref: "#/components/parameters/PageParam"
      - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of confirmed contributions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/campaigns/{campaignId}/contributions/{contributionId}/refund:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/CampaignIdParam"
    - name: contributionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags: [fundraising]
      summary: Refund a confirmed contribution
      description: >
        Manager-role (OWNER/ADMINISTRATOR) only, within 14 days of confirmation
        (ADR-017). Reverses the Stripe charge and records a REFUND ledger entry;
        the organization's earning portion is reversed net of the platform fee,
        which is not returned.
      operationId: refundContribution
      responses:
        "200":
          description: The refunded contribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionResponse"
        "400":
          description: Not confirmed, no payment on record, or outside the 14-day refund window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Media (organization/team/tournament branding + private profile photos — ADR-012/ADR-045) ---

  /organizations/{organizationId}/media/uploads:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    post:
      tags: [media]
      summary: Request a presigned upload URL
      description: >
        Creates a PENDING_UPLOAD media asset and returns a short-lived presigned PUT
        URL. The browser uploads directly to object storage; the API never proxies
        file bytes. entityType and entityId are optional only for legacy manager-only
        workflows; when one is supplied both are required and the target is authorized
        before the upload URL is issued.
      operationId: requestMediaUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadRequest"
      responses:
        "201":
          description: Upload requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/media/uploads/{assetId}/confirm:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/AssetIdParam"
    post:
      tags: [media]
      summary: Confirm an upload
      description: >
        Validates the uploaded bytes (size, magic-byte content-type sniff, image
        decode/dimension check) and transitions the asset to READY or REJECTED.
      operationId: confirmMediaUpload
      responses:
        "200":
          description: Confirmation result (asset may be READY or REJECTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/media/assignments:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [media]
      summary: List active media assignments
      description: Returns the organization's currently assigned LOGO/COVER, each with a freshly-signed read URL.
      operationId: listMediaAssignments
      responses:
        "200":
          description: Active media assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssignmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/media/assignments/{usageSlot}:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/UsageSlotParam"
    put:
      tags: [media]
      summary: Assign a READY asset to a usage slot
      description: >
        Retires the slot's prior active assignment (and archives its asset, if any)
        and assigns the given asset. Visibility is computed from the organization's
        public-page status (PUBLIC once published, else ORGANIZATION_PRIVATE).
      operationId: assignMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMediaRequest"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [media]
      summary: Retire the active assignment for a usage slot
      operationId: removeMediaAssignment
      responses:
        "204":
          description: Assignment retired
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


  /organizations/{organizationId}/media/assignments/entities/{entityType}/{entityId}:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/MediaEntityTypeParam"
    - $ref: "#/components/parameters/MediaEntityIdParam"
    get:
      tags: [media]
      summary: List active media for a scoped entity
      description: >
        Returns signed URLs only after resolving the team, tournament, household-adult,
        or participant target and enforcing the caller's exact resource relationship.
      operationId: listEntityMediaAssignments
      responses:
        "200":
          description: Active scoped media assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssignmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/media/assignments/entities/{entityType}/{entityId}/{usageSlot}:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/MediaEntityTypeParam"
    - $ref: "#/components/parameters/MediaEntityIdParam"
    - $ref: "#/components/parameters/UsageSlotParam"
    put:
      tags: [media]
      summary: Assign media to a scoped entity
      description: >
        TEAM and TOURNAMENT accept LOGO/COVER. HOUSEHOLD_ADULT and PARTICIPANT
        accept PROFILE_PHOTO. Backend capability/guardian/athlete-self checks are
        enforced before replacing the active assignment.
      operationId: assignEntityMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMediaRequest"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [media]
      summary: Retire scoped entity media
      operationId: removeEntityMedia
      responses:
        "204":
          description: Assignment retired
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/documents:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [documents]
      summary: List the organization's documents (any active org member)
      operationId: listOrganizationDocuments
      responses:
        "200":
          description: Organization documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [documents]
      summary: Assign an already-uploaded (usageSlot=DOCUMENT) asset as an organization-level document (org manager only)
      description: Upload the underlying file first via POST /organizations/{organizationId}/media/uploads (usageSlot=DOCUMENT) + its
        /confirm call.
      operationId: assignOrganizationDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignDocumentRequest"
      responses:
        "201":
          description: Document assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/documents/broadcast:
    post:
      tags: [documents]
      summary: Assign an already-uploaded document to every active household in the organization (org manager only)
      description: Convenience for a season-wide waiver/form — creates one assignment per household, all sharing the same underlying asset.
      operationId: broadcastDocumentToAllHouseholds
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignDocumentRequest"
      responses:
        "201":
          description: Document assigned to every household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/documents/{assignmentId}:
    delete:
      tags: [documents]
      summary: Retire a document (org manager only) — never deletes the underlying asset, which may back other households' assignments from
        a broadcast
      operationId: removeDocument
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Retired
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/documents/{assignmentId}/acknowledgments:
    get:
      tags: [documents]
      summary: List which guardians have acknowledged/signed this document (org manager only)
      operationId: listDocumentAcknowledgments
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Acknowledgments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAcknowledgmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/households/{householdId}/documents:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - $ref: "#/components/parameters/HouseholdIdParam"
    get:
      tags: [documents]
      summary: List a household's documents (org member or a guardian of this household)
      operationId: listHouseholdDocuments
      responses:
        "200":
          description: Household documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [documents]
      summary: Assign an already-uploaded document to one household (org manager only)
      operationId: assignHouseholdDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignDocumentRequest"
      responses:
        "201":
          description: Document assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/households/{householdId}/documents/{assignmentId}/acknowledge:
    post:
      tags: [documents]
      summary: Acknowledge ("sign") a household document — must be an active guardian of this household. Idempotent — re-acknowledging
        returns the existing record.
      operationId: acknowledgeDocument
      parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/HouseholdIdParam"
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Acknowledgment recorded (or already existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAcknowledgmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/campaigns/{slug}:
    get:
      tags: [fundraising]
      summary: Get a published campaign's public page by slug
      operationId: getPublicCampaign
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Published campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCampaignResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/campaigns/{slug}/contributions:
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
    post:
      tags: [fundraising]
      summary: Start a one-time contribution checkout (test-mode Stripe Checkout)
      description: >
        Public, unauthenticated. Creates a PENDING contribution and a Stripe
        Checkout Session; the caller redirects the browser to the returned
        checkoutUrl. Confirmation happens only via POST /webhooks/stripe, not this
        response — see ContributionService.
      operationId: createContributionCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContributionCheckoutRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionCheckoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The payments provider is unavailable (e.g. no Stripe test-mode key configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /public/campaigns/{slug}/contributions/{contributionId}:
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
    - name: contributionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags: [fundraising]
      summary: Poll a contribution's status
      description: >
        Public, unauthenticated — used by the browser's Stripe Checkout return
        page. Read-only: this never flips status itself, it only reflects what
        the Stripe webhook has already recorded.
      operationId: getContributionStatus
      responses:
        "200":
          description: Contribution status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Webhooks (DESIGN-DOC.md section 17) ---

  /webhooks/stripe:
    post:
      tags: [webhooks]
      summary: Stripe inbound webhook receiver
      description: >
        Not authenticated with a JWT — authenticity comes from the Stripe-Signature
        header instead, verified server-side against rally26.stripe.webhook-secret.
        Only checkout.session.completed is consumed this slice, for campaign
        contributions, store orders, and sponsorship purchases (disambiguated by
        the session's own metadata); other event types are recorded as IGNORED.
        Idempotent per (provider, externalEventId) — see webhook_event. Stripe
        Connect account-status webhooks remain Phase 5.
      operationId: receiveStripeWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload — verified via signature before being parsed, never trusted otherwise.
      responses:
        "200":
          description: Event processed (or already recorded — Stripe's own automatic retry of a known event is a no-op)
        "400":
          description: Signature verification failed
        "500":
          description: >
            Processing failed after signature verification succeeded — Stripe will
            retry automatically per its own retry schedule; no separate retry worker
            exists for this.

  # --- Printify catalog proxy (Phase 4 slice 1) ---
  # Never expose the Printify API token to the browser — these endpoints proxy
  # read-only catalog data through the backend. No pricing is returned here;
  # Printify's catalog never exposes cost/price (confirmed against Printify's
  # own OpenAPI spec) — that only appears once a product is actually created
  # (see POST .../products/{productId}/variants below).

  /organizations/{organizationId}/printify/blueprints:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [printify]
      summary: List Printify catalog blueprints (base product types)
      operationId: listPrintifyBlueprints
      responses:
        "200":
          description: Blueprints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrintifyBlueprintResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/PrintifyUnavailable"

  /organizations/{organizationId}/printify/blueprints/{blueprintId}/print-providers:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - name: blueprintId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags: [printify]
      summary: List US-located print providers for a blueprint
      description: >
        A location (and, where available, decoration-method) filter, not a price
        comparison — Printify's catalog has no cost signal to rank providers by.
        The admin picks one from this filtered list.
      operationId: listPrintifyPrintProviders
      responses:
        "200":
          description: US print providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EligiblePrintProviderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/PrintifyUnavailable"

  /organizations/{organizationId}/printify/blueprints/{blueprintId}/print-providers/{printProviderId}/variants:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - name: blueprintId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: printProviderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags: [printify]
      summary: List size/color variants a print provider offers for a blueprint
      operationId: listPrintifyCatalogVariants
      responses:
        "200":
          description: Catalog variants (no pricing — see note above)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrintifyCatalogVariantResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/PrintifyUnavailable"

  # --- Stores and products (Phase 4 slice 1) ---

  /organizations/{organizationId}/stores:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [stores]
      summary: List stores for an organization
      operationId: listStores
      parameters:
      - $ref: "#/components/parameters/PageParam"
      - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of stores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [stores]
      summary: Create a store
      description: Created in DRAFT status. Not publicly visible (via GET /public/stores/{slug}) until ACTIVE.
      operationId: createStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreRequest"
      responses:
        "201":
          description: Store created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The requested slug is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/offline-financial-records:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [offline-finance]
      summary: List organization-recorded offline financial transactions
      description: Manager-only. These records describe money received outside Rally26 and never fabricate payment-provider identifiers.
      operationId: listOfflineFinancialRecords
      parameters:
      - {name: verificationStatus, in: query, required: false, schema: {$ref: "#/components/schemas/OfflineVerificationStatus"}}
      - {name: recordType, in: query, required: false, schema: {$ref: "#/components/schemas/OfflineFinancialRecordType"}}
      - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200":
          description: Offline financial records
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OfflineFinancialRecordPageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /organizations/{organizationId}/offline-financial-records/{recordId}:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - {name: recordId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [offline-finance]
      summary: Get an offline financial record
      operationId: getOfflineFinancialRecord
      responses:
        "200":
          description: Offline financial record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OfflineFinancialRecordResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /organizations/{organizationId}/offline-financial-records/{recordId}/verify:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    - {name: recordId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [offline-finance]
      summary: Verify an externally received transaction
      description: Confirms the linked OFFLINE contribution, sponsorship, or order and appends balanced non-payout ledger entries. It never
        creates a Stripe or other provider transaction.
      operationId: verifyOfflineFinancialRecord
      responses:
        "200":
          description: Verified record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OfflineFinancialRecordResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /organizations/{organizationId}/offline-financial-records/contributions:
    parameters:
    - $ref: "#/components/parameters/OrganizationIdParam"
    post:

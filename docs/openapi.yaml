          $ref: "#/components/responses/Forbidden"
    post:
      tags: [events]
      summary: Create a reusable event template (Phase 16 slice 5, ADR-047; owner/administrator only)
      operationId: createEventTemplate
      parameters:
      - name: organizationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveEventTemplateRequest"
      responses:
        "201":
          description: Created event template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"


      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidRequest"
      responses:
        "200":
          description: Updated fee assignment (with recomputed balance)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":

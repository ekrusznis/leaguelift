      summary: A household's combined-schedule .ics file (Phase 10 slice 3, ADR-028) — same read authorization as GET /households/{householdId}/events
      operationId: getHouseholdIcs
      parameters:
        - name: householdId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: .ics file
          content:
            text/calendar:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{teamId}/events:
    get:
      tags: [events]
      summary: List events for a team, including events where this team is the opponent (Phase 10 slice 1, ADR-026; requires event.read at team scope)
      operationId: listTeamEvents
      parameters:
        - name: teamId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [events]
      summary: Create a team-owned event (Phase 10 slice 1, ADR-026; requires event.create at team scope)
      operationId: createTeamEvent
      parameters:
        - name: teamId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "200":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tournaments/{tournamentId}/events:
    get:
      tags: [events]
      summary: List a tournament's child events (Phase 10 slice 1, ADR-026; requires event.read at tournament scope)
      operationId: listTournamentEvents
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [events]
      summary: Create a tournament child event — may have TBD start time/opponent/area (Phase 10 slice 1, ADR-026; requires event.create at tournament scope)
      operationId: createTournamentEvent
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "200":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /events/{eventId}/rsvps:
    get:
      tags: [events]
      summary: RSVP summary + (staff only) individual responses for an event (Phase 10 slice 2, ADR-027) — a guardian/athlete with a participant on the event's team gets summary counts only, never another family's individual response
      operationId: getEventRsvps
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: RSVP summary and (if authorized) individual responses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRsvpsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /events/{eventId}/participants/{participantId}/rsvp:
    put:
      tags: [events]
      summary: Submit or update an RSVP for a participant (Phase 10 slice 2, ADR-027) — self (linked athlete), guardian (real guardian_relationship, not just any org member), or admin (staff with event.update at the event's scope)
      operationId: submitEventRsvp
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: participantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRsvpRequest"
      responses:
        "200":
          description: The current effective RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRsvpResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /households/{householdId}/events:
    get:
      tags: [events]
      summary: A household's combined schedule — every event owned by any team any of its active participants is on (Phase 10 slice 2, ADR-027)
      operationId: listHouseholdEvents
      parameters:
        - name: householdId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /participants/{participantId}/events:
    get:
      tags: [events]
      summary: A single participant's schedule — every event owned by any team the participant is on (Phase 10 slice 2, ADR-027)
      operationId: listParticipantEvents
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/outbox-events/dead-letter:
    get:
      tags: [outbox-admin]
      summary: Outbox events that exhausted retry attempts (Phase 8 slice 1, ADR-022; requires platform.integration.view)
      operationId: listDeadLetterOutboxEvents
      responses:
        "200":
          description: Dead-lettered outbox events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboxEventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/outbox-events/failed:
    get:
      tags: [outbox-admin]
      summary: Outbox events currently backing off after a retryable failure (Phase 8 slice 1, ADR-022; requires platform.integration.view)
      operationId: listFailedOutboxEvents
      responses:
        "200":
          description: Failed (retrying) outbox events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboxEventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/outbox-events/{id}/reprocess:
    post:
      tags: [outbox-admin]
      summary: Resets a DEAD_LETTER/FAILED outbox event back to PENDING with attempt_count reset to 0 (Phase 8 slice 1, ADR-022; requires platform.integration.manage)
      operationId: reprocessOutboxEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reset for reprocessing
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/contexts:
    get:
      tags: [authorization]
      summary: Every authorization context (PERSONAL/ATHLETE/HOUSEHOLD/TEAM/ORGANIZATION/TOURNAMENT/PLATFORM_ADMIN) the caller holds, with resolved capabilities (Phase 7/ADR-020)
      operationId: getMyContexts
      responses:
        "200":
          description: Contexts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContextResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/activity:
    get:
      tags: [activity]
      summary: Cross-org activity feed (DESIGN-DOC.md section 13, Phase 7 completion) — every organization the caller belongs to, or platform-wide for a platform administrator
      operationId: getMyActivity
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations/{organizationId}/search:
    get:
      tags: [search]
      summary: Global search within one organization — teams, participants, and households (DESIGN-DOC.md section 13, Phase 7 completion; any active org member)
      operationId: searchOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results (empty for a query under 2 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /platform/search:
    get:
      tags: [search]
      summary: Global search across organizations, platform-wide (platform administrator only)
      operationId: searchPlatform
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results (empty for a query under 2 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/teams/{teamId}/role-assignments:
    get:
      tags: [authorization]
      summary: List active role assignments for a team (org OWNER/ADMINISTRATOR only; backs the "Manage access" admin UI)
      operationId: listTeamRoleAssignments
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TeamIdParam"
      responses:
        "200":
          description: Active role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleAssignmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [authorization]
      summary: Grant a team-scoped role (COACH_READ/TEAM_EDITOR/TEAM_MANAGER) to an org member (org OWNER/ADMINISTRATOR only; Phase 7/ADR-020)
      operationId: grantTeamRoleAssignment
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TeamIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantRoleAssignmentRequest"
      responses:
        "201":
          description: Role assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/teams/{teamId}/role-assignments/{assignmentId}:
    delete:
      tags: [authorization]
      summary: Revoke a team-scoped role assignment (org OWNER/ADMINISTRATOR only; Phase 7/ADR-020)
      operationId: revokeTeamRoleAssignment
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TeamIdParam"
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/tournaments/{tournamentId}/role-assignments:
    get:
      tags: [authorization]
      summary: List active role assignments for a tournament (org OWNER/ADMINISTRATOR only; backs the "Manage access" admin UI)
      operationId: listTournamentRoleAssignments
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TournamentIdParam"
      responses:
        "200":
          description: Active role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleAssignmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [authorization]
      summary: Grant a tournament-scoped role (TOURNAMENT_VIEWER/TOURNAMENT_ADMINISTRATOR) to an org member (org OWNER/ADMINISTRATOR only; Phase 7/ADR-020)
      operationId: grantTournamentRoleAssignment
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TournamentIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantRoleAssignmentRequest"
      responses:
        "201":
          description: Role assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/tournaments/{tournamentId}/role-assignments/{assignmentId}:
    delete:
      tags: [authorization]
      summary: Revoke a tournament-scoped role assignment (org OWNER/ADMINISTRATOR only; Phase 7/ADR-020)
      operationId: revokeTournamentRoleAssignment
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TournamentIdParam"
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationIdParam:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamIdParam:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TournamentIdParam:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageIdParam:
      name: pageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HouseholdIdParam:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParticipantIdParam:
      name: participantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeeTemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeeAssignmentIdParam:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentIdParam:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdjustmentIdParam:
      name: adjustmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignIdParam:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetIdParam:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UsageSlotParam:
      name: usageSlot
      in: path
      required: true
      schema:
        type: string
        enum: [LOGO, COVER, PRODUCT_DESIGN, SPONSOR_LOGO]
    SponsorshipPackageIdParam:
      name: packageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SponsorIdParam:
      name: sponsorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SponsorshipIdParam:
      name: sponsorshipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StoreIdParam:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductIdParam:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not authorized for this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found (or not visible to the caller)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PrintifyUnavailable:
      description: The Printify API is not available right now (e.g. no PRINTIFY_API_TOKEN configured)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        version:
          type: string
          example: "0.1.0"
    ErrorResponse:
      type: object
      required: [code, message, requestId, fieldErrors]
      properties:
        code:
          type: string
          example: ORGANIZATION_NOT_FOUND
        message:
          type: string
          example: The organization could not be found.
        requestId:
          type: string
          example: req_01hz8x9y2z
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 200
        firstName:
          type: string
          maxLength: 60
        lastName:
          type: string
          maxLength: 60
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        user:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      required: [id, email, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
    CreateOrganizationRequest:
      type: object
      required: [name, slug, organizationType]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
        sports:
          type: array
          items:
            type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          maxLength: 40
    OrganizationType:
      type: string
      enum:
        - RECREATIONAL_LEAGUE
        - TRAVEL_CLUB
        - INDIVIDUAL_TEAM
        - TOURNAMENT_OPERATOR
        - BOOSTER_ORGANIZATION
        - MULTISPORT_FACILITY
        - COMMUNITY_PROGRAM
        - OTHER
    OrganizationResponse:
      type: object
      required: [id, name, slug, organizationType, status, sports, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        organizationType:
          $ref: "#/components/schemas/OrganizationType"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, ARCHIVED]
        sports:
          type: array
          items:
            type: string
        contactEmail:
          type: string
          format: email
          nullable: true
        contactPhone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:

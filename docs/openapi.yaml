      type: object
      required: [summary, responses]
      properties:
        summary:
          $ref: "#/components/schemas/RsvpSummaryResponse"
        responses:
          type: array
          description: Empty for a guardian/athlete caller (summary counts only) — populated only for staff with event.rsvp.read_team at the event's scope.
          items:
            $ref: "#/components/schemas/EventRsvpResponse"

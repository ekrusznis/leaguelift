        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/media/uploads/{assetId}/confirm:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/AssetIdParam"
    post:
      tags: [media]
      summary: Confirm an upload
      description: >
        Validates the uploaded bytes (size, magic-byte content-type sniff, image
        decode/dimension check) and transitions the asset to READY or REJECTED.
      operationId: confirmMediaUpload
      responses:
        "200":
          description: Confirmation result (asset may be READY or REJECTED)
          content:
            application/json:
              schema:

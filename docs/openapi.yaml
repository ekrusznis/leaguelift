          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipPackageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/sponsorship-packages/{packageId}/sponsorships:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/SponsorshipPackageIdParam"
    get:
      tags: [sponsorships]
      summary: List an organization's confirmed sponsorships for a package
      operationId: listPackageSponsorships
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"

openapi: 3.0.3
info:
  title: LeagueLift API
  description: >
    LeagueLift revenue, fundraising, commerce, and fee-management API for youth sports
    organizations. This document covers Phase 0 (foundation), Phase 1 (organization
    onboarding, teams, tournaments, and public pages), Phase 2 (households,
    participants, fee templates, and fee assignments), Phase 3 slice 11
    (fundraising campaigns and their public pages — contribution/payment recording
    is a later slice), and traditional email/password authentication (superseding
    the originally planned external-IdP/Auth0 approach — see DESIGN-DOC.md section
    11.5). Endpoints are added milestone by milestone — do not add backend endpoints
    without updating this document in the same change (DESIGN-DOC.md section 26.4).
  version: "0.7.0"
servers:
  - url: /api/v1
tags:
  - name: system
  - name: auth
  - name: identity
  - name: organizations
  - name: members
  - name: invitations
  - name: teams
  - name: tournaments
  - name: public-pages
  - name: households
  - name: participants
  - name: fees
  - name: fundraising
  - name: dashboard
paths:
  /public/status:
    get:
      tags: [system]
      summary: Public liveness/status check
      operationId: getPublicStatus
      security: []
      responses:
        "200":
          description: Service is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /auth/register:
    post:
      tags: [auth]
      summary: Create an account with an email and password
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with that email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with an email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bootstrap:
    post:
      tags: [identity]
      summary: Get the current authenticated user (idempotent; kept for client compatibility with /me)
      operationId: bootstrapCurrentUser
      responses:
        "200":
          description: Current user provisioned/retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [identity]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations:
    get:
      tags: [organizations]
      summary: List organizations the current user is a member of
      operationId: listOrganizations
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [organizations]
      summary: Create an organization
      description: The creator is granted the OWNER membership role.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [organizations]
      summary: Get an organization by ID
      operationId: getOrganization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [organizations]
      summary: Update an organization
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [members]
      summary: List members of an organization
      operationId: listOrganizationMembers
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [members]
      summary: Change a member's role
      description: >
        Owner-only role is out of scope here — ownership transfer is a separate
        controlled workflow (DESIGN-DOC.md section 7.2). Only OWNER or ADMINISTRATOR
        callers may change other members' roles.
      operationId: updateMembershipRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipRoleRequest"
      responses:
        "204":
          description: Role updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [members]
      summary: Revoke a member's access
      operationId: revokeMembership
      responses:
        "204":
          description: Membership revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/onboarding:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [organizations]
      summary: Get the organization's onboarding checklist status
      operationId: getOnboardingProgress
      responses:
        "200":
          description: Onboarding progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgressResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [invitations]
      summary: List pending administrator invitations
      operationId: listInvitations
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of pending invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [invitations]
      summary: Invite an adult administrator to the organization
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created. The response includes the raw token once —
            it is not retrievable afterward.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [invitations]
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      responses:
        "204":
          description: Invitation revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /invitations/{token}/accept:
    post:
      tags: [invitations]
      summary: Accept an invitation as the currently authenticated user
      description: >
        The invitation's email must match the caller's own account email. Not nested
        under /organizations/{organizationId} because the caller does not have
        membership in that organization yet.
      operationId: acceptInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted; membership granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Invitation email does not match the caller's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Teams ---

  /organizations/{organizationId}/teams:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [teams]
      summary: List active teams
      operationId: listTeams
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of active teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [teams]
      summary: Create a team
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A team with this name already exists in the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/TeamIdParam"
    get:
      tags: [teams]
      summary: Get a team by ID
      operationId: getTeam
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [teams]
      summary: Update a team
      operationId: updateTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [teams]
      summary: Archive a team
      operationId: archiveTeam
      responses:
        "204":
          description: Team archived
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Tournaments ---

  /organizations/{organizationId}/tournaments:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [tournaments]
      summary: List active tournaments
      operationId: listTournaments
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of active tournaments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [tournaments]
      summary: Create a tournament
      operationId: createTournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTournamentRequest"
      responses:
        "201":
          description: Tournament created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A tournament with this name already exists in the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/tournaments/{tournamentId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/TournamentIdParam"
    get:
      tags: [tournaments]
      summary: Get a tournament by ID
      operationId: getTournament
      responses:
        "200":
          description: Tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [tournaments]
      summary: Update a tournament
      operationId: updateTournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTournamentRequest"
      responses:
        "200":
          description: Updated tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [tournaments]
      summary: Archive a tournament
      operationId: archiveTournament
      responses:
        "204":
          description: Tournament archived
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Public pages ---

  /organizations/{organizationId}/pages:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [public-pages]
      summary: List all public pages for the organization
      operationId: listPublicPages
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of public pages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPagePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [public-pages]
      summary: Create a public page for an entity
      operationId: createPublicPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicPageRequest"
      responses:
        "201":
          description: Public page created in DRAFT status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A page for this entity or slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{organizationId}/pages/{pageId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/PageIdParam"
    get:
      tags: [public-pages]
      summary: Get a page by ID
      operationId: getPublicPage
      responses:
        "200":
          description: Public page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [public-pages]
      summary: Update page title, slug, or summary
      operationId: updatePublicPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePublicPageRequest"
      responses:
        "200":
          description: Updated page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/pages/{pageId}/publish:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/PageIdParam"
    post:
      tags: [public-pages]
      summary: Publish a page (DRAFT → PUBLISHED)
      operationId: publishPage
      responses:
        "200":
          description: Page published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/pages/{pageId}/unpublish:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/PageIdParam"
    post:
      tags: [public-pages]
      summary: Unpublish a page (PUBLISHED → DRAFT)
      operationId: unpublishPage
      responses:
        "200":
          description: Page unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/pages/{slug}:
    get:
      tags: [public-pages]
      summary: Get a published public page by slug (no auth required)
      operationId: getPublicPageBySlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Households ---

  /organizations/{organizationId}/households:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
    get:
      tags: [households]
      summary: List active households
      operationId: listHouseholds
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paginated list of active households
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [households]
      summary: Create a household
      operationId: createHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
      responses:
        "201":
          description: Household created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{organizationId}/households/{householdId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/HouseholdIdParam"
    get:
      tags: [households]
      summary: Get a household by ID
      operationId: getHousehold
      responses:
        "200":
          description: Household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [households]
      summary: Update a household
      operationId: updateHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseholdRequest"
      responses:
        "200":
          description: Updated household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/households/{householdId}/adults:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdParam"
      - $ref: "#/components/parameters/HouseholdIdParam"
    get:
      tags: [households]
      summary: List active adults in a household
      operationId: listHouseholdAdults
      responses:
        "200":
          description: List of active household adults
          content:
